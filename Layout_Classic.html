<style>
  .classic-container { padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; height: 100%; overflow-y: auto; background: var(--bg-main); }
  .classic-panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow); }
  .classic-header { font-size: 16px; font-weight: 800; color: var(--veo-cyan-dark); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
  
  .classic-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
  .classic-table th { background: var(--bg-panel); color: var(--text-muted); font-weight: 700; padding: 12px; border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
  .classic-table td { padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
  .classic-table tr:hover { background: var(--bg-panel); }
  
  .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
  .badge-ready { background: rgba(52, 199, 89, 0.1); color: var(--status-ready); border: 1px solid var(--status-ready); }
  .badge-active { background: rgba(0, 229, 255, 0.1); color: var(--status-active); border: 1px solid var(--status-active); }
  .badge-oos { background: rgba(255, 59, 48, 0.1); color: var(--status-oos); border: 1px solid var(--status-oos); }
</style>

<div class="classic-container">
  <!-- Top Panel: Active Deployments -->
  <div class="classic-panel">
    <div class="classic-header">Active Deployments (On Route)</div>
    <table class="classic-table">
      <thead><tr><th>Vehicle</th><th>Technician(s)</th><th>Zone</th><th>Time Out</th><th>Goals</th><th>Actions</th></tr></thead>
      <tbody id="classic-deployments-tbody"></tbody>
    </table>
  </div>
  
  <!-- Bottom Panel: Fleet Roster -->
  <div class="classic-panel">
    <div class="classic-header" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Fleet Roster & Status</span>
      <input type="text" id="classic-fleet-search" placeholder="Search Fleet..." style="padding:6px 12px; border:1px solid var(--border-color); border-radius:4px; background:var(--bg-main); color:var(--text-main);" onkeyup="renderClassicTable()">
    </div>
    <table class="classic-table">
      <thead><tr><th>Van Name</th><th>Unit #</th><th>Status</th><th>Plate</th><th>Samsara ID</th><th>Actions</th></tr></thead>
      <tbody id="classic-fleet-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  function renderClassicTable() {
    if(!globalState) return;
    
    // Render Active Deployments
    const activeDeps = globalState.deployments.filter(d => d.status === 'Dispatched');
    let depHtml = '';
    if(activeDeps.length === 0) {
      depHtml = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">No active deployments.</td></tr>';
    } else {
      activeDeps.forEach(d => {
        let tech = d.coDriver ? `${d.tech} + ${d.coDriver}` : d.tech;
        depHtml += `<tr>
          <td><strong>${d.vehicle}</strong> <br><span style="font-size:11px; color:var(--text-muted);">(${d.rentalId})</span></td>
          <td>${tech}</td>
          <td>${d.zone}</td>
          <td>${d.departureTime}</td>
          <td>${d.goals || '--'}</td>
          <td><button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="openVanActionModal('${d.rentalId}')">Manage</button></td>
        </tr>`;
      });
    }
    document.getElementById('classic-deployments-tbody').innerHTML = depHtml;

    // Render Fleet Roster
    const q = document.getElementById('classic-fleet-search') ? document.getElementById('classic-fleet-search').value.toLowerCase() : '';
    let fleetHtml = '';
    globalState.vehicles.forEach(v => {
      if(v.status === 'Decommissioned') return;
      if(q && !v.cleanName.toLowerCase().includes(q) && !v.plate.toLowerCase().includes(q) && !v.rentalId.toLowerCase().includes(q)) return;
      
      let bClass = v.status==='Warehouse (Ready)' ? 'badge-ready' : (v.status==='Dispatched' ? 'badge-active' : 'badge-oos');
      
      fleetHtml += `<tr>
        <td><strong>${v.cleanName}</strong></td>
        <td>${v.rentalId}</td>
        <td><span class="status-badge ${bClass}">${v.status}</span></td>
        <td>${v.plate}</td>
        <td style="font-family:monospace; color:var(--text-muted);">${v.samsaraSerial}</td>
        <td><button class="btn btn-primary" style="padding:4px 8px; font-size:11px;" onclick="openVanActionModal('${v.rentalId}')">Action</button></td>
      </tr>`;
    });
    document.getElementById('classic-fleet-tbody').innerHTML = fleetHtml;
  }
</script>
