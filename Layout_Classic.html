<style>
  .cls-wrap { padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 1400px; margin: 0 auto; height: 100%; overflow-y: auto; }
  .cls-panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .cls-header { font-size: 16px; font-weight: 800; color: var(--veo-cyan-dark); margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  
  .cls-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
  .cls-table th { background: var(--bg-panel); color: var(--text-muted); font-weight: 700; padding: 14px; border-bottom: 2px solid var(--border-color); text-transform: uppercase; letter-spacing: 0.5px; }
  .cls-table td { padding: 14px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
  .cls-table tr:hover { background: var(--bg-panel); }
  
  .cls-badge { padding: 4px 8px; border-radius: 4px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
</style>

<div class="cls-wrap">
  <div class="cls-panel">
    <div class="cls-header"><span>Active Deployments (Live Routes)</span></div>
    <table class="cls-table">
      <thead><tr><th>Van</th><th>Tech(s)</th><th>Zone</th><th>Time Out</th><th>Goals & Focus</th><th>Action</th></tr></thead>
      <tbody id="cls-active-body"></tbody>
    </table>
  </div>
  
  <div class="cls-panel">
    <div class="cls-header">
      <span>Fleet Roster & Status</span>
      <input type="text" id="cls-search" placeholder="🔍 Search Fleet..." class="control-select" style="width: 250px;" onkeyup="renderClassicTable()">
    </div>
    <table class="cls-table">
      <thead><tr><th>Van</th><th>Unit #</th><th>Status</th><th>Plate</th><th>Samsara ID</th><th>Action</th></tr></thead>
      <tbody id="cls-fleet-body"></tbody>
    </table>
  </div>
</div>

<script>
  function renderClassicTable() {
    if(!globalState) return;
    
    const deps = globalState.deployments.filter(d => d.status === 'Dispatched');
    document.getElementById('cls-active-body').innerHTML = deps.length ? deps.map(d => `<tr>
      <td><strong>${d.vehicle}</strong> <br><span style="color:var(--text-muted); font-size:11px;">(${d.rentalId})</span></td>
      <td style="font-weight:600;">${d.coDriver ? d.tech + ' <span style="color:var(--text-muted);">& '+d.coDriver+'</span>' : d.tech}</td>
      <td><span class="cls-badge" style="background:rgba(0,229,255,0.1); color:var(--veo-cyan-dark);">${d.zone}</span></td>
      <td>${d.departureTime}</td>
      <td style="max-width:200px;">${d.goals || '--'}</td>
      <td><button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="openVanActionModal('${d.rentalId}')">Manage</button></td>
    </tr>`).join('') : '<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-muted); font-weight:600;">No active deployments on route.</td></tr>';

    const q = document.getElementById('cls-search').value.toLowerCase();
    let fHtml = '';
    globalState.vehicles.forEach(v => {
      if(v.status === 'Decommissioned') return;
      if(q && !v.cleanName.toLowerCase().includes(q) && !v.plate.toLowerCase().includes(q) && !v.rentalId.toLowerCase().includes(q)) return;
      
      let bc = v.status === 'Warehouse (Ready)' ? 'color:var(--success); border:1px solid var(--success); background:rgba(52,199,89,0.1);' : 
              (v.status === 'Dispatched' ? 'color:var(--veo-cyan-dark); border:1px solid var(--veo-cyan-dark); background:rgba(0,229,255,0.1);' : 
              'color:var(--danger); border:1px solid var(--danger); background:rgba(255,59,48,0.1);');
      
      fHtml += `<tr>
        <td><strong>${v.cleanName}</strong></td><td style="color:var(--text-muted); font-size:12px;">${v.rentalId}</td>
        <td><span class="cls-badge" style="${bc}">${v.status}</span></td>
        <td>${v.plate}</td><td style="color:var(--text-muted); font-family:monospace;">${v.samsaraSerial}</td>
        <td><button class="btn btn-primary" style="padding:6px 12px; font-size:11px;" onclick="openVanActionModal('${v.rentalId}')">Action</button></td>
      </tr>`;
    });
    document.getElementById('cls-fleet-body').innerHTML = fHtml;
  }
</script>
