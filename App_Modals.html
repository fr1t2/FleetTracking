<!-- VAN ACTION MODAL -->
<div id="vanActionModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div id="va_title" style="color:var(--veo-cyan-dark)">Van Options</div><button class="modal-close" onclick="closeModal('vanActionModal')">&times;</button></div>
    <div class="modal-body" id="va_body"></div>
  </div>
</div>

<!-- TECH ACTION MODAL -->
<div id="techActionModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div id="ta_title" style="color:var(--veo-cyan-dark)">Tech Options</div><button class="modal-close" onclick="closeModal('techActionModal')">&times;</button></div>
    <div class="modal-body" id="ta_body"></div>
  </div>
</div>

<!-- ADD VAN MODAL -->
<div id="addVehicleModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>➕ Add Vehicle</div><button class="modal-close" onclick="closeModal('addVehicleModal')">&times;</button></div>
    <form onsubmit="submitAddVehicle(event)">
      <div class="modal-body">
        <div class="form-row"><div class="form-group"><label>Name *</label><input type="text" id="av_name" required></div><div class="form-group"><label>Rental # *</label><input type="text" id="av_rental" required></div></div>
        <div class="form-row"><div class="form-group"><label>Agency</label><select id="av_agency"></select></div><div class="form-group"><label>Make & Model</label><input type="text" id="av_model"></div></div>
        <div class="form-row"><div class="form-group"><label>VIN</label><input type="text" id="av_vin"></div><div class="form-group"><label>License Plate</label><input type="text" id="av_plate"></div></div>
        <div class="form-row"><div class="form-group"><label>Tag Expiration</label><input type="date" id="av_plate_exp"></div><div class="form-group"><label>Samsara ID</label><input type="text" id="av_samsara"></div></div>
        <div class="form-group"><label>Addons & Builds</label><input type="text" id="av_addons" placeholder="e.g. Shelving, Inverter..."></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('addVehicleModal')">Cancel</button><button type="submit" class="btn btn-primary">Save to Fleet</button></div>
    </form>
  </div>
</div>

<!-- EDIT VEHICLE MODAL -->
<div id="editVehicleModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>✏️ Edit Vehicle Specs</div><button class="modal-close" onclick="closeModal('editVehicleModal')">&times;</button></div>
    <form onsubmit="submitEditVehicle(event)">
      <div class="modal-body">
        <input type="hidden" id="ev_rental" />
        <div class="form-row"><div class="form-group"><label>Clean Name</label><input type="text" id="ev_name" required></div><div class="form-group"><label>License Plate</label><input type="text" id="ev_plate"></div></div>
        <div class="form-row"><div class="form-group"><label>Tag Expiration</label><input type="date" id="ev_plate_exp"></div><div class="form-group"><label>Samsara ID</label><input type="text" id="ev_samsara"></div></div>
        <div class="form-group"><label>Addons & Builds</label><input type="text" id="ev_addons"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('editVehicleModal')">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
    </form>
  </div>
</div>

<!-- DISPATCH MODAL -->
<div id="dispatchModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>📋 Dispatch Vehicle</div><button class="modal-close" onclick="closeModal('dispatchModal')">&times;</button></div>
    <form onsubmit="submitDispatch(event)">
      <div class="modal-body">
        <div class="form-group"><label>Van Assignment *</label><select id="dp_van" required></select></div>
        <div class="form-row"><div class="form-group"><label>Lead Tech *</label><select id="dp_tech" required></select></div><div class="form-group"><label>Shift *</label><select id="dp_shift" required></select></div></div>
        <div class="form-row"><div class="form-group"><label>Co-Driver (Optional)</label><select id="dp_codriver"></select></div><div class="form-group"><label style="margin-top:28px; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="dp_training" style="width:auto;"> 🎓 Training Route</label></div></div>
        <div class="form-row"><div class="form-group"><label>Work Zone *</label><select id="dp_zone" required></select></div><div class="form-group"><label>Battery Target</label><input type="text" id="dp_target"></div></div>
        <div class="form-group"><label>Focus</label><select id="dp_focus"></select></div>
        <div class="form-group"><label>Goals</label><textarea id="dp_goals" rows="2"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('dispatchModal')">Cancel</button><button type="submit" class="btn btn-primary">Deploy Van</button></div>
    </form>
  </div>
</div>

<!-- EDIT DISPATCH MODAL -->
<div id="editDispatchModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>✏️ Edit Active Dispatch</div><button class="modal-close" onclick="closeModal('editDispatchModal')">&times;</button></div>
    <form onsubmit="submitEditDispatch(event)">
      <div class="modal-body">
        <input type="hidden" id="ed_id" /><input type="hidden" id="ed_vehicle" /><input type="hidden" id="ed_rental" />
        <div class="form-row"><div class="form-group"><label>Work Zone</label><select id="ed_zone"></select></div><div class="form-group"><label>Battery Target</label><input type="text" id="ed_target"></div></div>
        <div class="form-group"><label>Goals & Directives</label><textarea id="ed_goals" rows="2"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('editDispatchModal')">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
    </form>
  </div>
</div>

<!-- ROSTER MODAL -->
<div id="rosterModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>👥 Employee Tech Roster</div><button class="modal-close" onclick="closeModal('rosterModal')">&times;</button></div>
    <div class="modal-body">
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <input type="text" id="roster-input" placeholder="Type name to add or filter..." list="tech-dl" style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main);" oninput="handleRosterInput()">
        <button id="roster-action-btn" type="button" class="btn btn-dark" onclick="handleRosterAction()">Add</button>
      </div>
      <div id="roster-list" style="padding:16px; background:var(--bg-main); border-radius:8px; border:1px solid var(--border-color); display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>
  </div>
</div>

<!-- REPORT ISSUE MODAL -->
<div id="incidentModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div style="color:var(--danger)">⚠️ Report Vehicle Issue</div><button class="modal-close" onclick="closeModal('incidentModal')">&times;</button></div>
    <form onsubmit="submitIncident(event)">
      <div class="modal-body">
        <div class="form-group"><label>Select Vehicle *</label><select id="inc_van" required></select></div>
        <div class="form-row"><div class="form-group"><label>Issue Category *</label><select id="inc_cat" required></select></div><div class="form-group"><label>Status Impact *</label><select id="inc_impact" required></select></div></div>
        <div class="form-group"><label>Driver Involved (Accidents)</label><select id="inc_driver"></select></div>
        <div class="form-group"><label style="display:flex; align-items:center; gap:8px; color:var(--danger);"><input type="checkbox" id="inc_oos" checked style="width:auto;" /> 🚨 Set vehicle to "Out of Service"</label></div>
        <div class="form-group"><label>Event Description *</label><textarea id="inc_desc" rows="3" required></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('incidentModal')">Cancel</button><button type="submit" class="btn btn-danger">Log Issue</button></div>
    </form>
  </div>
</div>

<!-- CHECK IN MODAL -->
<div id="checkInModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div style="color:var(--success)">✅ Return Van to Service</div><button class="modal-close" onclick="closeModal('checkInModal')">&times;</button></div>
    <form onsubmit="submitCheckIn(event)">
      <div class="modal-body">
        <div class="form-group"><label>Out-of-Service Van *</label><select id="ci_van" required></select></div>
        <div class="form-group"><label>Resolution & Repairs Completed *</label><textarea id="ci_notes" rows="3" required></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('checkInModal')">Cancel</button><button type="submit" class="btn btn-success">Check In Van</button></div>
    </form>
  </div>
</div>

<!-- DECOMMISSION MODAL -->
<div id="decomModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div style="color:var(--danger)">🛑 Decommission Van</div><button class="modal-close" onclick="closeModal('decomModal')">&times;</button></div>
    <form onsubmit="submitDecom(event)">
      <div class="modal-body">
        <div class="form-group"><label>Select Vehicle *</label><select id="dec_van" required></select></div>
        <div class="form-group"><label>Reason *</label><textarea id="dec_reason" rows="3" required></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('decomModal')">Cancel</button><button type="submit" class="btn btn-danger">Decommission</button></div>
    </form>
  </div>
</div>

<!-- EDIT TECH PROFILE MODAL -->
<div id="techEditModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>⚙️ Edit Tech Profile</div><button class="modal-close" onclick="closeModal('techEditModal')">&times;</button></div>
    <form onsubmit="submitTechEdit(event)">
      <div class="modal-body">
        <input type="hidden" id="te_orig_name" />
        <div class="form-row"><div class="form-group"><label>Name *</label><input type="text" id="te_name" required></div><div class="form-group"><label>Phone</label><input type="text" id="te_phone"></div></div>
        <div class="form-row">
          <div class="form-group"><label>Assigned Shift</label><select id="te_shift"></select></div>
          <div class="form-group"><label>Current Status</label><select id="te_status">
            <option value="Available">🟢 Available</option><option value="Off-Duty">⚪ Off-Duty</option>
            <option value="Sick">🤢 Sick (OOS)</option><option value="NCNS">🚨 NCNS (OOS)</option><option value="PTO">🌴 PTO (Scheduled)</option>
          </select></div>
        </div>
        <div class="form-row"><div class="form-group"><label>Start Time</label><input type="time" id="te_start"></div><div class="form-group"><label>End Time</label><input type="time" id="te_end"></div></div>
        <div class="form-group"><label>Normal Work Days</label><input type="text" id="te_days" placeholder="e.g. Mon-Fri, or Tues-Sat"></div>
        
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:16px; background:var(--bg-panel); padding:16px; border-radius:8px; border:1px solid var(--border-color);">
          <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="te_test" style="width:auto;"> ✅ Passed Driving Test</label>
          <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="te_gofast" style="width:auto;"> ⚡ Is Go-Fast Driver</label>
          <label style="display:flex; align-items:center; gap:8px; color:var(--danger); font-weight:bold;"><input type="checkbox" id="te_restricted" style="width:auto;"> 🛑 DRIVING RESTRICTED (Co-Driver Only)</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" style="color:var(--danger); border-color:var(--danger); margin-right:auto;" onclick="uiDeleteTech()">🗑️ Remove Tech</button>
        <button type="button" class="btn btn-outline" onclick="closeModal('techEditModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<!-- LOG ATTENDANCE MODAL -->
<div id="attendanceModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><div>📅 Log Attendance Exception</div><button class="modal-close" onclick="closeModal('attendanceModal')">&times;</button></div>
    <form onsubmit="submitAttendance(event)">
      <div class="modal-body">
        <div class="form-group"><label>Technician</label><input type="text" id="att_tech" readonly style="background:var(--bg-panel); font-weight:bold;"></div>
        <div class="form-row">
          <div class="form-group"><label>Date *</label><input type="date" id="att_date" required></div>
          <div class="form-group"><label>Exception Type *</label><select id="att_type" required>
            <option value="Sick">🤢 Sick / Call Out</option><option value="NCNS">🚨 No Call No Show (NCNS)</option><option value="PTO">🌴 PTO (Vacation)</option>
          </select></div>
        </div>
        <div class="form-group"><label>Notes / Details</label><textarea id="att_notes" rows="2"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline" onclick="closeModal('attendanceModal')">Cancel</button><button type="submit" class="btn btn-primary">Log & Update Status</button></div>
    </form>
  </div>
</div>
