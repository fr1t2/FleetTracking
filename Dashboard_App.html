<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEO Fleet Snapshot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --veo-cyan: #00E5FF; --veo-cyan-dark: #00B8CC;
      --bg-main: #f4f7f6; --bg-panel: #ffffff; --bg-modal-head: #f8f9fa;
      --text-main: #202124; --text-muted: #5f6368;
      --border-color: #e0e0e0; --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --ready: #34C759; --dispatched: #00B8CC; --oos: #FF3B30; --warning: #FFCC00;
      --danger: #FF3B30;
    }

    /* DARK MODE VARIABLES */
    [data-theme="dark"] {
      --bg-main: #0f1115; --bg-panel: #1a1d24; --bg-modal-head: #252932;
      --text-main: #ffffff; --text-muted: #9ba1a6;
      --border-color: #333842; --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }
    * { box-sizing: border-box; }

    /* Topbar & Search */
    .topbar { background: var(--bg-panel); padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); transition: 0.3s; }
    .search-box { padding: 10px 16px; width: 250px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Inter'; background: var(--bg-main); color: var(--text-main); }
    .theme-btn { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .theme-btn:hover { border-color: var(--veo-cyan-dark); }

    /* Snapshot Grid */
    .grid-container { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1800px; margin: 0 auto; }
    
    .van-card { background: var(--bg-panel); border-radius: 12px; padding: 20px; cursor: pointer; position: relative; overflow: hidden; border: 1px solid var(--border-color); box-shadow: var(--shadow); transition: 0.2s; }
    .van-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-color: var(--veo-cyan-dark); }
    
    /* Status Colors */
    .st-ready { border-top: 5px solid var(--ready); }
    .st-dispatched { border-top: 5px solid var(--dispatched); }
    .st-oos { border-top: 5px solid var(--oos); }
    
    /* Safe-to-Drive Warning Ribbon */
    .ribbon-warning { position: absolute; top: 0; right: 0; background: var(--warning); color: #000; font-size: 10px; font-weight: 800; padding: 4px 12px; border-bottom-left-radius: 8px; }

    /* Tabbed Modal (Native Dialog) */
    dialog { border: none; border-radius: 16px; padding: 0; width: 95%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); margin: auto; background: var(--bg-panel); color: var(--text-main); transition: 0.3s; }
    dialog::backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    
    .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border-color); font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .modal-tabs { display: flex; background: var(--bg-modal-head); border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; transition: 0.2s; }
    .tab-btn.active { color: var(--veo-cyan-dark); border-bottom-color: var(--veo-cyan-dark); background: var(--bg-panel); }
    .tab-content { display: none; padding: 24px; min-height: 250px; max-height: 60vh; overflow-y: auto; }
    .tab-content.active { display: block; }
    
    .btn { padding: 10px 16px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; font-family: 'Inter'; transition: 0.2s; }
    .btn-primary { background: var(--veo-cyan-dark); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: var(--oos); color: #fff; }
    .btn-success { background: var(--ready); color: #fff; }
    .btn-dark { background: #202124; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: var(--bg-main); }
    
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 12px; font-family: 'Inter'; box-sizing: border-box; background: var(--bg-main); color: var(--text-main); }
    .row { display: flex; gap: 16px; }
    .col { flex: 1; }

    /* Dialog Footer */
    .dlg-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; background: var(--bg-modal-head); }

    /* Predictive Driver Card */
    .driver-card { background: var(--bg-modal-head); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
    .driver-card:hover { border-color: var(--veo-cyan-dark); }
    .d-badge { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 800; display: inline-block; margin-right: 4px; }
    .b-pass { background: #d1fae5; color: #065f46; }
    .b-fail { background: #fee2e2; color: #991b1b; }

    #global-loader { display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--veo-cyan); z-index: 9999; }
  </style>
</head>
<body>
  <div id="global-loader"></div>

  <div class="topbar">
    <div style="font-size:20px; font-weight:900; letter-spacing:-0.5px;">VEO Snapshot</div>
    <div style="display:flex; gap:12px; align-items:center;">
      <input type="text" id="global-search" class="search-box" placeholder="Search Vans or Drivers..." onkeyup="renderGrid()">
      <select id="grid-sort" class="form-control" style="width:auto; margin-bottom:0;" onchange="renderGrid()">
        <option value="status-type-name">Sort: Status ➔ Type ➔ Name</option>
        <option value="name">Sort: Alphabetical (A-Z)</option>
        <option value="type-name">Sort: Group by Type</option>
      </select>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙</button>
    </div>
  </div>

  <div class="grid-container" id="fleet-grid"></div>

  <!-- 360 VEHICLE MODAL -->
  <dialog id="van-modal">
    <div class="modal-head">
      <span id="vm-title">Van Name</span>
      <button onclick="document.getElementById('van-modal').close()" style="border:none; background:none; font-size:24px; color:var(--text-muted); cursor:pointer;">&times;</button>
    </div>
    
    <div class="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('dispatch')">Dispatch</button>
      <button class="tab-btn" onclick="switchTab('driver')">Driver</button>
      <button class="tab-btn" onclick="switchTab('specs')">Specs</button>
      <button class="tab-btn" onclick="switchTab('service')">Service</button>
    </div>

    <div id="tab-dispatch" class="tab-content active">
      <input type="hidden" id="vm-rental-id">
      <input type="hidden" id="vm-selected-tech">
      <div id="dispatch-view"></div>
    </div>
    <div id="tab-driver" class="tab-content"><div id="driver-view"></div></div>
    <div id="tab-specs" class="tab-content"><div id="specs-view"></div></div>
    <div id="tab-service" class="tab-content"><div id="service-view"></div></div>
    <div class="dlg-footer" id="vm-footer"></div>
  </dialog>

  <!-- EDIT DISPATCH MODAL -->
  <dialog id="edit-dispatch-modal" style="max-width: 500px; z-index: 1005;">
    <div class="modal-head">✏️ Edit Active Shift</div>
    <div style="padding: 24px;">
      <input type="hidden" id="ed-dep-id">
      <input type="hidden" id="ed-rental-id">
      <input type="hidden" id="ed-selected-tech">
      
      <label style="font-size:12px; font-weight:700;">Driver (Search to Change)</label>
      <input type="text" id="ed-driver-search" class="form-control" placeholder="Search tech roster..." onkeyup="searchDriverEdit()">
      <div id="ed-driver-result-card" style="margin-bottom:12px; max-height:150px; overflow-y:auto;"></div>

      <div class="row">
        <div class="col form-group">
          <label style="font-size:12px; font-weight:700;">Zone(s)</label>
          <select id="ed-zone" class="form-control" multiple style="height:90px;"></select>
        </div>
        <div class="col form-group">
          <label style="font-size:12px; font-weight:700;">Shift Focus</label>
          <select id="ed-focus" class="form-control">
            <option value="">-- Select --</option>
            <option value="Battery Swap">Battery Swap</option>
            <option value="Rebalance">Rebalance</option>
            <option value="Retrieval">Retrieval</option>
            <option value="Standard Route">Standard Route</option>
          </select>
        </div>
      </div>

      <div class="dlg-footer" style="padding: 16px 0 0 0; background: transparent; border-top: none;">
        <button class="btn btn-outline" type="button" onclick="document.getElementById('edit-dispatch-modal').close()">Cancel</button>
        <button class="btn btn-primary" type="button" onclick="submitEditDispatch()">Save Changes</button>
      </div>
    </div>
  </dialog>

<!-- LOG MAINTENANCE MODAL -->
  <dialog id="log-service-modal" style="max-width: 450px; z-index: 1001;">
    <div class="modal-head">📝 Log Maintenance</div>
    <div style="padding: 24px;">
      <input type="hidden" id="ls-rental-id">
      <input type="hidden" id="ls-clean-name">
      
      <div class="form-group">
        <label style="font-size:12px; font-weight:700;">Issue Category</label>
        <select id="ls-category" class="form-control">

        </select>
      </div>
      
      <div class="form-group">
          <label style="font-size:12px; font-weight:700;">Status Impact</label>
          <input type="text" id="ls-impact" class="form-control" placeholder="e.g. Cannot operate, missing side mirror">
      </div>

      <div class="form-group">
          <label style="font-size:12px; font-weight:700;">Description / Event Details</label>
          <textarea id="ls-desc" class="form-control" rows="3" placeholder="Describe the issue..."></textarea>
      </div>
      
      <!-- REDUNDANT SEVERITY DROPDOWN REMOVED. JUST THE CHECKBOX NOW. -->
      <label style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; margin-bottom:16px;">
        <input type="checkbox" id="ls-oos" style="transform:scale(1.2);"> Mark Vehicle Out of Service
      </label>
      
      <div class="dlg-footer" style="padding: 16px 0 0 0; background: transparent; border-top: none;">
        <button class="btn btn-outline" type="button" onclick="document.getElementById('log-service-modal').close()">Cancel</button>
        <button class="btn btn-danger" type="button" onclick="submitNewService()">Submit Ticket</button>
      </div>
    </div>
  </dialog>

  <!-- UNSAVED CHANGES WARNING MODAL -->
  <dialog id="unsaved-modal" style="max-width: 350px; z-index: 1002;">
    <div class="modal-head" style="color:var(--danger)">⚠️ Unsaved Changes</div>
    <div style="padding: 24px;">
      <p style="margin-top:0; font-size:14px; font-weight:500;">You have entered information in this form. Are you sure you want to close it and discard your changes?</p>
      <div class="dlg-footer" style="padding: 24px 0 0 0; background: transparent; border-top: none;">
        <button class="btn btn-outline" type="button" onclick="document.getElementById('unsaved-modal').close()">Keep Editing</button>
        <button class="btn btn-danger" type="button" onclick="forceCloseModal()">Discard Changes</button>
      </div>
    </div>
  </dialog>

  <script>
    let globalState = null;

    // Theme Management
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-toggle').innerText = isDark ? '🌙' : '☀️';
      localStorage.setItem('veo_theme', isDark ? 'light' : 'dark');
    }

    window.onload = function() { 
      if (localStorage.getItem('veo_theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').innerText = '☀️';
      }
      loadData(); 
    };

    function loadData() {
      document.getElementById('global-loader').style.display = 'block';
      google.script.run
        .withSuccessHandler(state => { 
            globalState = JSON.parse(state); 
            renderGrid(); 
            document.getElementById('global-loader').style.display = 'none'; 
        })
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error loading data: " + err.message);
        })
        .getDashboardState();
    }

    function renderGrid() {
      if(!globalState) return;
      const q = document.getElementById('global-search').value.toLowerCase();
      const sortMode = document.getElementById('grid-sort').value;
      
      let vans = [...(globalState.vehicles || [])];
      const statusWeight = { 'Dispatched': 1, 'Warehouse (Ready)': 2, 'Out of Service': 3 };
      
      vans.sort((a, b) => {
        if (sortMode === 'status-type-name') {
            if (statusWeight[a.status] !== statusWeight[b.status]) return statusWeight[a.status] - statusWeight[b.status];
            if (a.type !== b.type) return (a.type || '').localeCompare(b.type || '');
            return a.cleanName.localeCompare(b.cleanName);
        } else if (sortMode === 'type-name') {
            if (a.type !== b.type) return (a.type || '').localeCompare(b.type || '');
            return a.cleanName.localeCompare(b.cleanName);
        } else {
            return a.cleanName.localeCompare(b.cleanName);
        }
      });

      let html = '';
      vans.forEach(v => {
        if (v.status === 'Decommissioned') return;
        if (q && !v.cleanName.toLowerCase().includes(q) && !(v.driver || '').toLowerCase().includes(q)) return;

        let bClass = v.status === 'Warehouse (Ready)' ? 'st-ready' : (v.status === 'Dispatched' ? 'st-dispatched' : 'st-oos');
        let ribbon = (String(v.safeToDrive) === 'true') ? '<div class="ribbon-warning">MAINT NEEDED (SAFE)</div>' : '';
        
        let subText = '';
        if (v.status === 'Dispatched') {
          const dep = (globalState.deployments || []).find(d => d.rentalId === v.rentalId && d.status === 'Dispatched');
          const focusStr = (dep && dep.goals) ? `<div style="font-size:11px; color:var(--veo-cyan-dark); font-weight:700; margin-top:4px;">🎯 ${dep.goals}</div>` : '';
          subText = `<div style="font-weight:700; color:var(--dispatched); margin-top:8px;">👤 ${v.driver}</div><div style="font-size:12px; color:var(--text-muted);">📍 ${v.zone}</div>${focusStr}`;
        } else {
          subText = `<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Type: ${v.type || 'Van'}</div>`;
        }

        html += `
          <div class="van-card ${bClass}" onclick="openVanModal('${v.rentalId}')">
            ${ribbon}
            <div style="font-size:18px; font-weight:800;">${v.cleanName} <span style="font-size:12px; font-weight:normal; color:var(--text-muted); float:right;">${v.rentalId}</span></div>
            ${subText}
          </div>
        `;
      });
      document.getElementById('fleet-grid').innerHTML = html;
    }

    /* --- MODAL ENGINE --- */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
    }

    function openVanModal(rentalId) {
      const v = (globalState.vehicles || []).find(x => x.rentalId === rentalId);
      if (!v) return;
      
      document.getElementById('vm-rental-id').value = rentalId;
      document.getElementById('vm-title').innerText = v.cleanName;
      document.getElementById('vm-selected-tech').value = '';
      
      const dep = (globalState.deployments || []).find(d => d.rentalId === rentalId && d.status === 'Dispatched');
      const tech = (globalState.techs || []).find(t => t.name === (dep ? dep.tech : v.driver));

      // 1. Dispatch Tab & Action Footer
      let dHtml = '';
      let footerHtml = `<button class="btn btn-outline" type="button" onclick="document.getElementById('van-modal').close()">Close</button>`;
      
      if (v.status === 'Warehouse (Ready)') {
        dHtml = `
          <div style="margin-bottom:16px;">
            <label style="font-size:12px; font-weight:700;">Assign Driver (Search Tech Roster)</label>
            <input type="text" id="live-driver-search" class="form-control" placeholder="Type name..." onkeyup="searchDriver()">
            <div id="driver-result-card" style="margin-bottom:12px; max-height:200px; overflow-y:auto;"></div>
          </div>
          <div class="row">
            <div class="col form-group">
              <label style="font-size:12px; font-weight:700;">Zone(s)</label>
              <select id="sel-zone" class="form-control" multiple style="height:90px;">
                ${(globalState.zones || []).map(z=>`<option value="${z}">${z}</option>`).join('')}
              </select>
            </div>
            <div class="col form-group">
              <label style="font-size:12px; font-weight:700;">Shift Focus</label>
              <select id="sel-focus" class="form-control">
                <option value="">-- Select --</option>
                <option value="Battery Swap">Battery Swap</option>
                <option value="Rebalance">Rebalance</option>
                <option value="Retrieval">Retrieval</option>
                <option value="Standard Route">Standard Route</option>
              </select>
              <label style="font-size:12px; font-weight:700; margin-top:8px;">Batteries Out</label>
              <input type="number" id="sel-batt" class="form-control" placeholder="0">
            </div>
          </div>
        `;
        footerHtml += `<button class="btn btn-danger" type="button" onclick="openLogService('${v.rentalId}', '${v.cleanName}')">➕ Log Maintenance</button>`;
        footerHtml += `<button class="btn btn-primary" type="button" onclick="submitDispatch()">🚀 Dispatch Now</button>`;
      } else if (v.status === 'Dispatched') {
        dHtml = `
          <div style="background:rgba(0, 229, 255, 0.05); border:1px solid var(--veo-cyan); padding:16px; border-radius:8px;">
            <h4 style="margin-top:0; color:var(--veo-cyan-dark);">Active Route Details</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size:14px;">
              <div><strong>Tech:</strong> ${dep ? dep.tech : v.driver}</div>
              <div><strong>Out Since:</strong> ${dep ? dep.departureTime : 'Unknown'}</div>
              <div><strong>Zone(s):</strong> ${dep ? dep.zone : v.zone}</div>
              <div><strong>Focus:</strong> ${dep ? dep.goals : '—'}</div>
              <div><strong>Batteries Out:</strong> ${dep ? dep.battery : '0'}</div>
            </div>
          </div>
        `;
        footerHtml += `<button class="btn btn-danger" type="button" onclick="openLogService('${v.rentalId}', '${v.cleanName}')">➕ Log Maintenance</button>`;
        footerHtml += `<button class="btn btn-outline" type="button" onclick="openEditDispatchModal('${dep ? dep.id : ''}')">✏️ Edit Shift</button>`;
        footerHtml += `<button class="btn btn-dark" type="button" onclick="submitEndShift('${dep ? dep.id : ''}')">🛑 End Shift</button>`;
      } else {
        dHtml = `<div style="padding:20px; background:rgba(255, 59, 48, 0.1); color:var(--danger); border-radius:8px; font-weight:bold;">⚠️ Vehicle is currently Out of Service.</div>`;
        footerHtml += `<button class="btn btn-success" type="button" onclick="submitCheckIn()">✅ Check In to Warehouse</button>`;
      }
      document.getElementById('dispatch-view').innerHTML = dHtml;
      document.getElementById('vm-footer').innerHTML = footerHtml;

      // 2. Driver Tab
      if (tech) {
        document.getElementById('driver-view').innerHTML = `
          <h4 style="margin-top:0;">${tech.name}</h4>
          <p><strong>Drive Test:</strong> ${tech.passedTest ? 'Pass' : 'Fail'}</p>
          <p><strong>Coast Enrolled:</strong> ${tech.coastEnrolled ? 'Yes' : 'No'}</p>
          <p><strong>Samsara Violation:</strong> ${tech.samsaraViolation ? '<span style="color:var(--oos)">YES</span>' : 'No'}</p>
          <p><strong>Flags:</strong> ${tech.flagged || 'None'}</p>
        `;
      } else {
        document.getElementById('driver-view').innerHTML = `<p>No active driver assigned.</p>`;
      }

      // 3. Specs Tab
      document.getElementById('specs-view').innerHTML = `
        <p><strong>Type:</strong> ${v.type || 'Cargo Van'}</p>
        <p><strong>Plate:</strong> ${v.plate} <span style="font-size:12px; color:var(--text-muted);">(Exp: ${v.plateExpDate || 'N/A'})</span></p>
        <p><strong>Coast Card:</strong> ${v.coast || 'No'}</p>
        <p><strong>Addons:</strong> ${v.addons || 'None'}</p>
        <p><strong>Samsara:</strong> <a href="${v.samsaraLink}" target="_blank" style="color:var(--veo-cyan-dark);">View GPS</a></p>
      `;

      // 4. Service Tab
      let allIncidents = (globalState.incidents || []).filter(i => i.rentalId === rentalId);
      let openIncidents = allIncidents.filter(i => !i.dateResolved);
      let closedIncidents = allIncidents.filter(i => i.dateResolved);

      let incHtml = openIncidents.map(i => `
        <div style="border:1px solid var(--border-color); padding:12px; border-radius:6px; margin-bottom:8px;">
          <div style="font-weight:700; color:${i.severity === 'OOS' ? 'var(--oos)' : 'var(--warning)'};">${i.severity} Issue</div>
          <div style="font-size:13px; margin:4px 0 8px 0;">${i.desc || i.issue}</div>
          <input type="text" id="res-${i.id}" class="form-control" placeholder="Resolution notes..." style="padding:6px; font-size:12px; margin-bottom:8px;">
          <button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="closeService('${i.id}', '${rentalId}')">Close Ticket</button>
        </div>
      `).join('');

      let histHtml = closedIncidents.map(i => `
        <div style="font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border-color); padding:6px 0;">
          <strong>${i.dateReported}</strong>: ${i.desc || i.issue} <br>
          <em style="color:var(--ready);">Resolved: ${i.resolution}</em>
        </div>
      `).join('');

      document.getElementById('service-view').innerHTML = `
        <div style="background:var(--bg-modal-head); padding:12px; border-radius:8px; margin-bottom:16px; border:1px solid var(--border-color);">
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span>Last Oil: <strong>${v.lastOil || 'N/A'}</strong></span>
            <span>Last Tires: <strong>${v.lastTires || 'N/A'}</strong></span>
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:8px; margin-bottom:12px;">
          <strong style="font-size:14px;">Open Tickets</strong>
          <button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="openLogService('${rentalId}', '${v.cleanName}')">➕ Log Maintenance</button>
        </div>
        <div style="margin-bottom:16px;">
          ${incHtml || '<p style="font-size:13px; color:var(--text-muted);">No open service tickets.</p>'}
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:8px; margin-bottom:12px;">
          <strong style="font-size:14px;">Service History</strong>
        </div>
        <div style="max-height:150px; overflow-y:auto;">
          ${histHtml || '<p style="font-size:13px; color:var(--text-muted);">No past service records.</p>'}
        </div>
      `;

      document.querySelectorAll('.tab-btn')[0].click();
      const vm = document.getElementById('van-modal');
      vm.dataset.dirty = 'false';
      vm.showModal();
    }

    /* --- LIVE DRIVER SEARCH (MULTI-MATCH) --- */
    function searchDriver() {
      const q = document.getElementById('live-driver-search').value.toLowerCase();
      const container = document.getElementById('driver-result-card');

      if(q.length < 1) { 
        container.innerHTML = ''; 
        document.getElementById('vm-selected-tech').value = ''; 
        return; 
      }
      
      const matches = (globalState.techs || []).filter(t => t.name.toLowerCase().includes(q));
      
      if(matches.length > 0) {
        container.innerHTML = matches.map(match => {
          let flagAlert = match.flagged ? `<div style="color:var(--oos); font-size:11px; margin-top:4px;">🚨 ${match.flagged}</div>` : '';
          let vioAlert = match.samsaraViolation ? `<span class="d-badge b-fail">SAMSARA VIO</span>` : '';
          
          return `
            <div class="driver-card" id="dcard-${match.name.replace(/\s+/g, '')}" onclick="selectDriver('${match.name}')">
              <div style="display:flex; justify-content:space-between;">
                <strong>${match.name}</strong>
                <div>
                  <span class="d-badge ${match.passedTest ? 'b-pass' : 'b-fail'}">Test: ${match.passedTest ? 'PASS' : 'FAIL'}</span>
                  <span class="d-badge ${match.coastEnrolled ? 'b-pass' : 'b-fail'}">Coast</span>
                  ${vioAlert}
                </div>
              </div>
              ${flagAlert}
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = `<div style="padding:12px; font-size:13px; color:var(--text-muted); text-align:center; border: 1px dashed var(--border-color); border-radius: 8px;">No matching drivers found.</div>`;
      }
    }

    function selectDriver(name) {
      document.getElementById('vm-selected-tech').value = name;
      document.getElementById('van-modal').dataset.dirty = 'true';
      
      document.querySelectorAll('#driver-result-card .driver-card').forEach(c => {
        c.style.borderColor = 'var(--border-color)';
        c.style.backgroundColor = 'var(--bg-modal-head)';
      });
      const sel = document.getElementById('dcard-' + name.replace(/\s+/g, ''));
      if(sel) {
        sel.style.borderColor = 'var(--veo-cyan-dark)';
        sel.style.backgroundColor = 'rgba(0, 229, 255, 0.05)';
      }
    }

    /* --- EDIT DISPATCH ENGINE --- */
    function openEditDispatchModal(depId) {
      if(!depId) return;
      const dep = (globalState.deployments || []).find(d => d.id === depId);
      if (!dep) return;
      
      document.getElementById('ed-dep-id').value = dep.id;
      document.getElementById('ed-rental-id').value = dep.rentalId;
      document.getElementById('ed-selected-tech').value = dep.tech;
      document.getElementById('ed-driver-search').value = dep.tech;
      document.getElementById('ed-driver-result-card').innerHTML = ''; 
      
      const zoneSel = document.getElementById('ed-zone');
      zoneSel.innerHTML = (globalState.zones || []).map(z=>`<option value="${z}">${z}</option>`).join('');
      
      const activeZones = (dep.zone || '').split(',').map(z => z.trim());
      Array.from(zoneSel.options).forEach(opt => {
          if(activeZones.includes(opt.value)) opt.selected = true;
      });

      document.getElementById('ed-focus').value = dep.goals || '';

      document.getElementById('van-modal').close();
      const edm = document.getElementById('edit-dispatch-modal');
      edm.dataset.dirty = 'false';
      edm.showModal();
    }

    function searchDriverEdit() {
      const q = document.getElementById('ed-driver-search').value.toLowerCase();
      const container = document.getElementById('ed-driver-result-card');
      if(q.length < 1) { 
        container.innerHTML = ''; 
        document.getElementById('ed-selected-tech').value = ''; 
        return; 
      }
      
      const matches = (globalState.techs || []).filter(t => t.name.toLowerCase().includes(q));
      
      if(matches.length > 0) {
        container.innerHTML = matches.map(match => {
          return `
            <div class="driver-card" id="edcard-${match.name.replace(/\s+/g, '')}" onclick="selectDriverEdit('${match.name}')">
              <strong>${match.name}</strong>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = `<div style="padding:12px; font-size:13px; color:var(--text-muted); text-align:center; border: 1px dashed var(--border-color); border-radius: 8px;">No matching drivers found.</div>`;
      }
    }

    function selectDriverEdit(name) {
      document.getElementById('ed-selected-tech').value = name;
      document.getElementById('ed-driver-search').value = name;
      document.getElementById('edit-dispatch-modal').dataset.dirty = 'true';
      
      document.querySelectorAll('#ed-driver-result-card .driver-card').forEach(c => {
        c.style.borderColor = 'var(--border-color)';
        c.style.backgroundColor = 'var(--bg-modal-head)';
      });
      const sel = document.getElementById('edcard-' + name.replace(/\s+/g, ''));
      if(sel) {
        sel.style.borderColor = 'var(--veo-cyan-dark)';
        sel.style.backgroundColor = 'rgba(0, 229, 255, 0.05)';
      }
    }

    function submitEditDispatch() {
      const tech = document.getElementById('ed-selected-tech').value;
      if (!tech) { alert('Please select a valid driver.'); return; }
      
      const payload = {
        id: document.getElementById('ed-dep-id').value,
        rentalId: document.getElementById('ed-rental-id').value,
        assignedTech: tech,
        workZone: Array.from(document.getElementById('ed-zone').selectedOptions).map(o => o.value).join(', '),
        goals: document.getElementById('ed-focus').value
      };
      
      const edm = document.getElementById('edit-dispatch-modal');
      edm.dataset.dirty = 'false';
      edm.close();
      
      const d = globalState.deployments.find(x => x.id === payload.id);
      if (d) { d.tech = payload.assignedTech; d.zone = payload.workZone; d.goals = payload.goals; }
      const v = globalState.vehicles.find(x => x.rentalId === payload.rentalId);
      if (v) { v.driver = payload.assignedTech; v.zone = payload.workZone; }
      renderGrid();

      document.getElementById('global-loader').style.display = 'block';
      google.script.run.withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error: " + err.message);
            loadData();
        })
        .updateDeploymentRecord(payload);
    }

    /* --- SUBMISSION HANDLERS --- */
    function submitDispatch() {
      const tech = document.getElementById('vm-selected-tech').value;
      if (!tech) { alert('Please select a driver from the search.'); return; }
      
      const rentalId = document.getElementById('vm-rental-id').value;
      const payload = {
        rentalId: rentalId,
        assignedTech: tech,
        workZone: Array.from(document.getElementById('sel-zone').selectedOptions).map(o => o.value).join(', '),
        goals: document.getElementById('sel-focus').value,
        batteryTarget: document.getElementById('sel-batt').value,
        shift: 'First Shift'
      };
      
      const vm = document.getElementById('van-modal');
      vm.dataset.dirty = 'false';
      vm.close();

      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      if (v) { v.status = 'Dispatched'; v.driver = payload.assignedTech; v.zone = payload.workZone; }
      globalState.deployments.unshift({ id: 'temp-' + Date.now(), rentalId: rentalId, tech: payload.assignedTech, zone: payload.workZone, goals: payload.goals, battery: payload.batteryTarget, status: 'Dispatched', departureTime: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      renderGrid(); 

      document.getElementById('global-loader').style.display = 'block';
      google.script.run.withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error: " + err.message);
            loadData();
        })
        .processDispatchCheckout(payload);
    }

    function submitEndShift(depId) {
      if(!depId) return;
      const rentalId = document.getElementById('vm-rental-id').value;
      const payload = { deploymentId: depId, rentalId: rentalId };
      const vm = document.getElementById('van-modal');
      vm.dataset.dirty = 'false';
      vm.close();

      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      if (v) { v.status = 'Warehouse (Ready)'; v.driver = '—'; v.zone = '—'; }
      const d = globalState.deployments.find(x => x.id === depId);
      if (d) d.status = 'Completed';
      renderGrid();
      
      document.getElementById('global-loader').style.display = 'block';
      google.script.run.withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error: " + err.message);
            loadData();
        })
        .endShift(payload);
    }

    function submitCheckIn() {
      const rentalId = document.getElementById('vm-rental-id').value;
      const payload = { rentalId: rentalId };
      const vm = document.getElementById('van-modal');
      vm.dataset.dirty = 'false';
      vm.close();
      
      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      if (v) { v.status = 'Warehouse (Ready)'; v.driver = '—'; v.zone = '—'; v.safeToDrive = 'false'; }
      (globalState.incidents || []).forEach(i => { if (i.rentalId === rentalId && !i.dateResolved) { i.dateResolved = new Date().toISOString(); } });
      renderGrid();
      
      document.getElementById('global-loader').style.display = 'block';
      google.script.run.withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error: " + err.message);
            loadData();
        })
        .processCheckInVehicle(payload);
    }

/* --- SERVICE ENGINE --- */
    function openLogService(rentalId, cleanName) {
      // Close the van modal first if it is open
      const vm = document.getElementById('van-modal');
      if (vm && vm.open) vm.close();
      
      document.getElementById('ls-rental-id').value = rentalId || '';
      document.getElementById('ls-clean-name').value = cleanName || '';
      document.getElementById('ls-impact').value = '';
      document.getElementById('ls-desc').value = '';
      
      // Inject the dynamic categories from the Config tab
      const catSelect = document.getElementById('ls-category');
      if (globalState.issueCategories && globalState.issueCategories.length > 0) {
        catSelect.innerHTML = globalState.issueCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      } else {
        // Fallback just in case the config column is empty
        catSelect.innerHTML = `<option value="Mechanical">Mechanical</option><option value="Body Damage">Body Damage</option><option value="Other">Other</option>`;
      }
      
      // Default to checking the OOS box for safety
      document.getElementById('ls-oos').checked = true; 
      
      const lsm = document.getElementById('log-service-modal');
      lsm.dataset.dirty = 'false';
      lsm.showModal();
    }

    function submitNewService() {
      const rentalId = document.getElementById('ls-rental-id').value;
      const isOos = document.getElementById('ls-oos').checked;
      
      const payload = {
        rentalId: rentalId,
        cleanName: document.getElementById('ls-clean-name').value,
        category: document.getElementById('ls-category').value,
        severity: isOos ? 'OOS' : 'Minor', // Let the checkbox dictate the severity
        statusImpact: document.getElementById('ls-impact').value,
        description: document.getElementById('ls-desc').value,
        isOos: isOos
      };
      
      const lsm = document.getElementById('log-service-modal');
      lsm.dataset.dirty = 'false';
      lsm.close();

      // OPTIMISTIC SYNC
      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      if (v) {
          if (payload.isOos) {
              v.status = 'Out of Service'; 
              v.driver = '—'; 
              v.zone = '—'; 
              v.safeToDrive = 'false';
              
              const d = globalState.deployments.find(x => x.rentalId === rentalId && x.status === 'Dispatched');
              if(d) d.status = 'Completed';
          } else { 
              v.safeToDrive = 'true'; 
          }
      }
      globalState.incidents.unshift({ 
        id: 'temp-' + Date.now(), 
        rentalId: rentalId, 
        severity: payload.severity, 
        issue: payload.description, 
        dateReported: new Date().toLocaleDateString() 
      });
      renderGrid();
      
      document.getElementById('global-loader').style.display = 'block';
      
      // Assumes your backend function is logNewServiceNeed or processReportIncident
      const backendCall = google.script.run
        .withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error logging service: " + err.message);
            loadData();
        });

      if (typeof backendCall.logNewServiceNeed === 'function') {
          backendCall.logNewServiceNeed(payload);
      } else {
          backendCall.processReportIncident(payload);
      }
    }

    function closeService(incId, rentalId) {
      const notes = document.getElementById('res-' + incId).value;
      if (!notes) { alert('Please enter resolution notes to close the issue.'); return; }
      
      document.getElementById('van-modal').close();

      const inc = globalState.incidents.find(i => i.id === incId);
      if (inc) inc.dateResolved = new Date().toISOString();
      const hasOtherOpen = globalState.incidents.some(i => i.rentalId === rentalId && !i.dateResolved && i.id !== incId);
      
      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      if (!hasOtherOpen && v) {
          if (v.status === 'Out of Service') {
              v.status = 'Warehouse (Ready)';
          }
          v.safeToDrive = 'false';
      }
      renderGrid();
      
      document.getElementById('global-loader').style.display = 'block';
      google.script.run.withSuccessHandler(loadData)
        .withFailureHandler(err => {
            document.getElementById('global-loader').style.display = 'none';
            alert("Error closing ticket: " + err.message);
            loadData();
        })
        .closeServiceIssue({ incidentId: incId, rentalId: rentalId, resolutionNotes: notes });
    }

    /* --- SMART MODAL CLICK-OFF PROTECTION --- */
    let pendingCloseDialog = null;

    document.querySelectorAll('dialog').forEach(dlg => {
      dlg.addEventListener('input', () => dlg.dataset.dirty = 'true');
      dlg.addEventListener('change', () => dlg.dataset.dirty = 'true');
      
      dlg.addEventListener('click', (e) => {
        if (e.target === dlg) {
          if (dlg.id === 'unsaved-modal') {
            dlg.close();
            return;
          }
          if (dlg.dataset.dirty === 'true') {
            pendingCloseDialog = dlg;
            document.getElementById('unsaved-modal').showModal();
          } else {
            dlg.close();
          }
        }
      });
    });

    function forceCloseModal() {
      if (pendingCloseDialog) {
        pendingCloseDialog.close();
        pendingCloseDialog.dataset.dirty = 'false'; 
        pendingCloseDialog = null;
      }
      document.getElementById('unsaved-modal').close();
    }
  </script>
</body>
