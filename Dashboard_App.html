<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEO Dispatch OS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('CSS_Global'); ?>
</head>
<body>
  <div id="global-loader" class="loader-bar"></div>

  <!-- TOP NAVIGATION BAR -->
  <header class="top-nav">
    <div class="brand">VEO OS <span style="font-size:11px; background:rgba(0,229,255,0.2); padding:4px 8px; border-radius:12px; color:var(--veo-cyan);">v3.0</span></div>
    
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchTab('dispatch')">📋 Dispatch Control</div>
      <div class="nav-tab" onclick="switchTab('fleet')">🚚 Fleet Registry</div>
      <div class="nav-tab" onclick="switchTab('techs')">👤 Tech Profiles</div>
      <div class="nav-tab" onclick="switchTab('history')">🕰️ Shift History</div>
    </div>

    <div class="system-controls">
      <select id="theme-selector" class="control-select" onchange="changeTheme()">
        <option value="light">Light Theme</option>
        <option value="dark" selected>Dark Theme</option>
        <option value="veo-dynamic">VEO Dynamic</option>
      </select>
      
      <select id="layout-selector" class="control-select" onchange="changeLayout()" style="border-color:var(--veo-cyan); color:var(--veo-cyan);">
        <option value="modern" selected>Dispatch (Modern)</option>
        <option value="classic">Classic Professional</option>
        <option value="focus">Focus Operations</option>
      </select>
      
      <button class="btn btn-outline" onclick="openModal('incidentModal')" style="color:var(--danger); border-color:var(--danger);">⚠️ Report OOS</button>
      <button class="btn btn-primary" onclick="loadPortalData()">🔄 Refresh</button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="main-content">
    
    <!-- TAB 1: DISPATCH -->
    <div id="tab-dispatch" class="tab-content active" style="padding:0;">
      <div id="layout-classic" style="display:none; height:100%;"><?!= include('Layout_Classic'); ?></div>
      <div id="layout-modern" style="display:none; height:100%;"><?!= include('Layout_Modern'); ?></div>
      <div id="layout-focus" style="display:none; height:100%;"><?!= include('Layout_Focus'); ?></div>
    </div>

    <!-- TAB 2: FLEET REGISTRY -->
    <div id="tab-fleet" class="tab-content">
       <div style="display:flex; justify-content:space-between; margin-bottom:24px; background:var(--bg-surface); padding:16px 24px; border-radius:12px; border:1px solid var(--border-color); box-shadow:var(--shadow);">
          <input type="text" id="fleet-search" placeholder="🔍 Search van or plate..." class="control-select" style="width:300px;" onkeyup="renderFleetGrid()" />
          <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" onclick="openModal('decomModal')">🛑 Decommission</button>
            <button class="btn btn-dark" onclick="openModal('addVehicleModal')">+ Add Van</button>
          </div>
       </div>
       <div id="fleet-card-grid"></div>
    </div>

    <!-- TAB 3: TECH PROFILES -->
    <div id="tab-techs" class="tab-content">
       <div style="display:flex; justify-content:space-between; margin-bottom:24px; background:var(--bg-surface); padding:16px 24px; border-radius:12px; border:1px solid var(--border-color); box-shadow:var(--shadow);">
          <input type="text" id="tech-search" placeholder="🔍 Search employee..." class="control-select" style="width:300px;" onkeyup="renderTechGrid()" />
          <button class="btn btn-outline" onclick="openModal('rosterModal')">👥 Manage Roster</button>
       </div>
       <div id="tech-card-grid"></div>
    </div>

    <!-- TAB 4: SHIFT HISTORY -->
    <div id="tab-history" class="tab-content">
       <div style="display:flex; justify-content:space-between; margin-bottom:24px; background:var(--bg-surface); padding:16px 24px; border-radius:12px; border:1px solid var(--border-color); box-shadow:var(--shadow); flex-wrap:wrap; gap:16px;">
          <div style="display:flex; gap:10px;">
            <input type="date" id="hist-date" class="control-select" onchange="renderHistoryTab()" />
            <select id="hist-shift" class="control-select" onchange="renderHistoryTab()"></select>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" onclick="triggerCsvExport()">📥 Export CSV</button>
            <button class="btn btn-outline" onclick="triggerPdfPrint()">🖨️ Print PDF</button>
          </div>
       </div>
       <div id="history-table-body"></div>
    </div>
  </main>

  <!-- INJECT MODALS AND SCRIPTS -->
  <?!= include('App_Modals'); ?>
  <?!= include('App_Scripts'); ?>
</body>
</html>
