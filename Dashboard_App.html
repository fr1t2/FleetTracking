<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEO Fleet Snapshot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --veo-cyan: #00E5FF; --veo-cyan-dark: #00B8CC;
      --bg-main: #f4f7f6; --bg-panel: #ffffff;
      --text-main: #202124; --text-muted: #5f6368;
      --border-color: #e0e0e0; --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --ready: #34C759; --dispatched: #00B8CC; --oos: #FF3B30; --warning: #FFCC00;
    }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); }
    * { box-sizing: border-box; }

    /* Topbar & Search */
    .topbar { background: var(--bg-panel); padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
    .search-box { padding: 10px 16px; width: 300px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Inter'; }

    /* Snapshot Grid */
    .grid-container { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1800px; margin: 0 auto; }
    
    .van-card { background: var(--bg-panel); border-radius: 12px; padding: 20px; cursor: pointer; position: relative; overflow: hidden; border: 1px solid var(--border-color); box-shadow: var(--shadow); transition: 0.2s; }
    .van-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    
    /* Status Colors */
    .st-ready { border-top: 5px solid var(--ready); }
    .st-dispatched { border-top: 5px solid var(--dispatched); }
    .st-oos { border-top: 5px solid var(--oos); }
    
    /* Safe-to-Drive Warning Ribbon */
    .ribbon-warning { position: absolute; top: 0; right: 0; background: var(--warning); color: #000; font-size: 10px; font-weight: 800; padding: 4px 12px; border-bottom-left-radius: 8px; }

    /* Tabbed Modal */
    dialog { border: none; border-radius: 16px; padding: 0; width: 95%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    dialog::backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    
    .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border-color); font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .modal-tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-weight: 600; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--veo-cyan-dark); border-bottom-color: var(--veo-cyan-dark); background: #fff; }
    .tab-content { display: none; padding: 24px; min-height: 300px; max-height: 60vh; overflow-y: auto; }
    .tab-content.active { display: block; }
    
    .btn { padding: 10px 16px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; }
    .btn-primary { background: var(--veo-cyan-dark); color: #fff; width: 100%; }
    .btn-danger { background: var(--oos); color: #fff; width: 100%; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 12px; font-family: 'Inter'; }

    /* Predictive Driver Card */
    .driver-card { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .d-badge { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 800; }
    .b-pass { background: #d1fae5; color: #065f46; }
    .b-fail { background: #fee2e2; color: #991b1b; }

    #global-loader { display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--veo-cyan); z-index: 9999; }
  </style>
</head>
<body>
  <div id="global-loader"></div>

  <div class="topbar">
    <div style="font-size:20px; font-weight:900; letter-spacing:-0.5px;">VEO Snapshot</div>
    <input type="text" id="global-search" class="search-box" placeholder="Search Vans or Drivers..." onkeyup="renderGrid()">
  </div>

  <div class="grid-container" id="fleet-grid"></div>

  <!-- 360 VEHICLE MODAL -->
  <dialog id="van-modal">
    <div class="modal-head">
      <span id="vm-title">Van Name</span>
      <button onclick="document.getElementById('van-modal').close()" style="border:none; background:none; font-size:24px; cursor:pointer;">&times;</button>
    </div>
    
    <div class="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('dispatch')">Dispatch</button>
      <button class="tab-btn" onclick="switchTab('specs')">Specs</button>
      <button class="tab-btn" onclick="switchTab('service')">Service</button>
    </div>

    <!-- TAB: DISPATCH -->
    <div id="tab-dispatch" class="tab-content active">
      <input type="hidden" id="vm-rental-id">
      <div id="dispatch-view"></div>
    </div>

    <!-- TAB: SPECS -->
    <div id="tab-specs" class="tab-content">
      <div id="specs-view"></div>
    </div>

    <!-- TAB: SERVICE -->
    <div id="tab-service" class="tab-content">
      <div id="service-view"></div>
      <button class="btn btn-danger" style="margin-top:16px;" onclick="logNewService()">+ Log Service Need</button>
    </div>
  </dialog>

  <script>
    let globalState = null;

    window.onload = function() { loadData(); };

    function loadData() {
      document.getElementById('global-loader').style.display = 'block';
      google.script.run
        .withSuccessHandler(state => { globalState = state; renderGrid(); document.getElementById('global-loader').style.display = 'none'; })
        .getDashboardState();
    }

    function renderGrid() {
      if(!globalState) return;
      const q = document.getElementById('global-search').value.toLowerCase();
      
      // SEAMLESS SORT: Status -> Type -> Name
      let vans = [...globalState.vehicles];
      const statusWeight = { 'Dispatched': 1, 'Warehouse (Ready)': 2, 'Out of Service': 3 };
      
      vans.sort((a, b) => {
        if (statusWeight[a.status] !== statusWeight[b.status]) return statusWeight[a.status] - statusWeight[b.status];
        if (a.type !== b.type) return a.type.localeCompare(b.type);
        return a.cleanName.localeCompare(b.cleanName);
      });

      let html = '';
      vans.forEach(v => {
        if (v.status === 'Decommissioned') return;
        if (q && !v.cleanName.toLowerCase().includes(q) && !v.driver.toLowerCase().includes(q)) return;

        let bClass = v.status === 'Warehouse (Ready)' ? 'st-ready' : (v.status === 'Dispatched' ? 'st-dispatched' : 'st-oos');
        let ribbon = v.safeToDrive ? '<div class="ribbon-warning">MAINT NEEDED (SAFE)</div>' : '';
        
        let subText = v.status === 'Dispatched' 
          ? `<div style="font-weight:700; color:var(--dispatched); margin-top:8px;">👤 ${v.driver}</div><div style="font-size:12px; color:var(--text-muted);">📍 ${v.zone}</div>` 
          : `<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Type: ${v.type}</div>`;

        html += `
          <div class="van-card ${bClass}" onclick="openVanModal('${v.rentalId}')">
            ${ribbon}
            <div style="font-size:18px; font-weight:800;">${v.cleanName} <span style="font-size:12px; font-weight:normal; color:var(--text-muted); float:right;">${v.rentalId}</span></div>
            ${subText}
          </div>
        `;
      });
      document.getElementById('fleet-grid').innerHTML = html;
    }

    /* --- MODAL ENGINE --- */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
    }

    function openVanModal(rentalId) {
      const v = globalState.vehicles.find(x => x.rentalId === rentalId);
      document.getElementById('vm-rental-id').value = rentalId;
      document.getElementById('vm-title').innerText = v.cleanName;
      
      // Build Dispatch Tab
      let dHtml = '';
      if (v.status === 'Warehouse (Ready)') {
        dHtml = `
          <h4 style="margin-top:0;">Deploy Vehicle</h4>
          <input type="text" id="live-driver-search" class="form-control" placeholder="Search Tech Roster..." onkeyup="searchDriver()">
          <div id="driver-result-card"></div>
          <select id="sel-zone" class="form-control" multiple style="height:100px;">
            ${globalState.config.zones.map(z=>`<option value="${z}">${z}</option>`).join('')}
          </select>
          <button class="btn btn-primary" onclick="submitDispatch()">🚀 Dispatch Now</button>
        `;
      } else if (v.status === 'Dispatched') {
        const dep = globalState.deployments.find(d => d.rentalId === rentalId && d.status === 'Dispatched');
        dHtml = `
          <h4 style="margin-top:0; color:var(--dispatched);">Active Route</h4>
          <p><strong>Tech:</strong> ${dep ? dep.tech : v.driver}</p>
          <p><strong>Zones:</strong> ${dep ? dep.zone : v.zone}</p>
          <p><strong>Out Since:</strong> ${dep ? dep.departureTime : 'Unknown'}</p>
          <button class="btn btn-primary" style="background:#000;" onclick="submitEndShift('${dep ? dep.id : ''}')">🛑 End Shift</button>
        `;
      } else {
        dHtml = `<p style="color:var(--oos); font-weight:bold;">Vehicle is Out of Service.</p>`;
      }
      document.getElementById('dispatch-view').innerHTML = dHtml;

      // Build Specs Tab
      document.getElementById('specs-view').innerHTML = `
        <p><strong>Type:</strong> ${v.type}</p>
        <p><strong>Plate:</strong> ${v.plate}</p>
        <p><strong>Samsara:</strong> <a href="${v.samsaraLink}" target="_blank">View GPS</a></p>
      `;

      // Build Service Tab
      document.getElementById('service-view').innerHTML = `
        <div style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:16px; border:1px solid var(--border-color);">
          <div style="display:flex; justify-content:space-between; font-size:12px;">
            <span>Last Oil: <strong>${v.lastOil}</strong></span>
            <span>Last Tires: <strong>${v.lastTires}</strong></span>
          </div>
        </div>
        <p style="color:var(--oos); font-weight:600;">${v.notes || 'No active service notes.'}</p>
      `;

      switchTab('dispatch');
      document.getElementById('van-modal').showModal();
    }

    /* --- LIVE DRIVER SEARCH --- */
    function searchDriver() {
      const q = document.getElementById('live-driver-search').value.toLowerCase();
      if(q.length < 2) { document.getElementById('driver-result-card').innerHTML = ''; return; }
      
      const match = globalState.techs.find(t => t.name.toLowerCase().includes(q));
      if(match) {
        let flagAlert = match.flagged ? `<div style="color:var(--oos); font-size:11px; margin-top:4px;">🚨 ${match.flagged}</div>` : '';
        document.getElementById('driver-result-card').innerHTML = `
          <div class="driver-card" data-tech="${match.name}">
            <div>
              <strong>${match.name}</strong>
              ${flagAlert}
            </div>
            <div style="text-align:right;">
              <span class="d-badge ${match.passedTest ? 'b-pass' : 'b-fail'}">Test: ${match.passedTest ? 'PASS' : 'FAIL'}</span>
              <span class="d-badge ${match.coastEnrolled ? 'b-pass' : 'b-fail'}" style="margin-left:4px;">Coast</span>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
