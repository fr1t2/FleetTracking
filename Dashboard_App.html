<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEO Dispatch OS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('CSS_Global'); ?>
</head>
<body>
  <div id="global-loader" class="loader-bar"></div>

  <!-- TOP NAVIGATION BAR -->
  <header class="top-nav">
    <div class="logo" style="font-size:24px; font-weight:900; letter-spacing:1px;">VEO</div>    
    <!-- TOP NAVIGATION -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('dispatch')">📋 Dispatch</button>
      <button class="nav-tab" onclick="switchTab('fleet')">🚚 Fleet</button>
      <button class="nav-tab" onclick="switchTab('techs')">👤 Techs</button>
      <button class="nav-tab" onclick="switchTab('monitor')">📡 Shift</button>
    </div>

    <div class="system-controls">
      <select id="theme-selector" class="control-select" onchange="changeTheme()">
        <option value="light">Light Theme</option>
        <option value="dark" selected>Dark Theme</option>
        <option value="veo-dynamic">VEO Dynamic</option>
      </select>
      
      <select id="layout-selector" class="control-select" onchange="changeLayout()" style="border-color:var(--veo-cyan); color:var(--veo-cyan);">
        <option value="modern" selected>Dispatch (Modern)</option>
        <option value="classic">Classic Professional</option>
        <option value="focus">Focus Operations</option>
      </select>
      
      <button class="btn btn-outline" onclick="openModal('incidentModal')" style="color:var(--danger); border-color:var(--danger);">⚠️ Report OOS</button>
      <button class="btn btn-primary" onclick="loadPortalData()">🔄 Refresh</button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="main-content">
    
    <!-- TAB 1: DISPATCH -->
    <div id="tab-dispatch" class="tab-content active" style="padding:0;">
      <div id="layout-classic" style="display:none; height:100%;"><?!= include('Layout_Classic'); ?></div>
      <div id="layout-modern" style="display:none; height:100%;"><?!= include('Layout_Modern'); ?></div>
      <div id="layout-focus" style="display:none; height:100%;"><?!= include('Layout_Focus'); ?></div>
    </div>

<!-- UNIFIED SHIFT TAB -->
<div id="tab-monitor" class="tab-content">
  <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
    <div>
      <h2 style="font-size:20px; font-weight:900; color:var(--veo-cyan);">Shift Monitor & Logs</h2>
      <p style="color:var(--text-muted); font-size:12px;">Live operations grid and historical records.</p>
    </div>
    
    <!-- Date/Shift Filters and Export Buttons -->
    <div style="display:flex; gap:10px; align-items:center; background:var(--bg-panel); padding:8px 12px; border-radius:8px; border:1px solid var(--border-color);">
      <input type="date" id="hist-date" class="control-select" onchange="renderShiftMonitor()" style="margin:0;">
      <select id="hist-shift" class="control-select" onchange="renderShiftMonitor()" style="margin:0;"></select>
      <button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="triggerCsvExport()">📥 CSV</button>
      <button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="triggerPdfPrint()">🖨️ PDF</button>
    </div>
  </div>
  
  <!-- The JS Engine will inject the Grid or the History here dynamically -->
  <div id="shift-monitor-grid"></div>
</div>

    <!-- TAB 2: FLEET REGISTRY -->
    <div id="tab-fleet" class="tab-content">
       <div style="display:flex; justify-content:space-between; margin-bottom:24px; background:var(--bg-surface); padding:16px 24px; border-radius:12px; border:1px solid var(--border-color); box-shadow:var(--shadow);">
          <input type="text" id="fleet-search" placeholder="🔍 Search van or plate..." class="control-select" style="width:300px;" onkeyup="renderFleetGrid()" />
          <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" onclick="openModal('decomModal')">🛑 Decommission</button>
            <button class="btn btn-dark" onclick="openModal('addVehicleModal')">+ Add Van</button>
          </div>
       </div>
       <div id="fleet-card-grid"></div>
    </div>

  <!-- TAB 3: TECH PROFILES -->
  <!-- TECH PROFILES TAB CONTENT -->
  <div id="tab-techs" class="tab-content">
    
    <!-- 1. ADVANCED TECH FILTER BAR -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:16px; background:var(--bg-panel); padding:16px; border-radius:8px; border:1px solid var(--border-color);">
      <div>
        <label style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:800;">Search Name</label>
        <input type="text" id="tech-search" placeholder="🔍 Search Techs..." onkeyup="renderTechGrid()" style="width:100%;" class="form-control">
      </div>
      <div>
        <label style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:800;">Filter by Shift</label>
        <select id="tech-filter-shift" onchange="renderTechGrid()" style="width:100%;" class="form-control">
          <option value="">All Shifts</option>
          <!-- Populated dynamically by Apps Script -->
        </select>
      </div>
      <div>
        <label style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:800;">Filter by Start Time</label>
        <select id="tech-filter-time" onchange="renderTechGrid()" style="width:100%;" class="form-control">
          <option value="">All Start Times</option>
          <option value="05:00-07:59">First Shift (5 AM - 7 AM)</option>
          <option value="13:00-15:59">Second Shift (1 PM - 3 PM)</option>
          <option value="21:00-23:59">Third Shift (9 PM - 11 PM)</option>
        </select>
      </div>
      <div>
        <label style="font-size:10px; color:var(--text-muted); text-transform:uppercase; font-weight:800;">Sort Mode</label>
        <select id="tech-sort" onchange="renderTechGrid()" style="width:100%;" class="form-control">
          <option value="smart">Smart View (Deployed on Top)</option>
          <option value="shift_time">Shift ➔ Time ➔ A-Z</option>
          <option value="alpha">Alphabetical (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- 2. THE EMPTY CONTAINER THE JAVASCRIPT LOOKS FOR -->
    <div id="tech-card-grid"></div>
    
  </div>


  </main>

  <!-- INJECT MODALS AND SCRIPTS -->
  <?!= include('App_Modals'); ?>
  <?!= include('App_Scripts'); ?>
</body>
</html>
