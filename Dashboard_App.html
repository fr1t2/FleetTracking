<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEO Dispatch OS</title>
  
  <!-- 1. INJECT GLOBAL CSS -->
  <?!= include('CSS_Global'); ?>
</head>
<body>
  <div id="global-loader" class="loader-bar"></div>

  <!-- TOP NAVIGATION & CONTROLS -->
  <header class="top-nav">
    <div class="brand">
      <span>VEO OS</span>
      <span style="font-size:12px; font-weight:600; color:var(--text-muted); background:var(--bg-panel); padding:4px 8px; border-radius:12px;">v2.0</span>
    </div>
    
    <div class="system-controls">
      <select id="theme-selector" class="control-select" onchange="changeTheme()">
        <option value="light">Light Theme</option>
        <option value="dark" selected>Dark Theme</option>
        <option value="veo-dynamic">VEO Dynamic</option>
      </select>

      <select id="layout-selector" class="control-select" onchange="changeLayout()">
        <option value="command">Command Center (Dispatch Desk)</option>
        <option value="classic">Classic Professional (Tables)</option>
        <option value="modern">Home Assistant (Widgets)</option>
      </select>
      
      <button class="btn btn-primary" onclick="loadPortalData()">🔄 Refresh</button>
    </div>
  </header>

  <!-- DYNAMIC LAYOUT CONTAINER -->
  <div id="layout-container">
    <!-- Layouts will be injected here via JavaScript -->
  </div>

<!-- DYNAMIC LAYOUT CONTAINER -->
  <div id="layout-container" style="flex:1; display:flex; overflow:hidden;">
    <div id="layout-command" style="display:none; width:100%; height:100%;"><?!= include('Layout_Command'); ?></div>
    <div id="layout-classic" style="display:none; width:100%; height:100%;"><?!= include('Layout_Classic'); ?></div>
    <div id="layout-modern" style="display:none; width:100%; height:100%;"><?!= include('Layout_Modern'); ?></div>
  </div>

  <script>
    let globalState = null;

    window.onload = function() { changeTheme(); changeLayout(); loadPortalData(); };

    function changeTheme() {
      const theme = document.getElementById('theme-selector').value;
      if (theme === 'light') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }

    function changeLayout() {
      document.getElementById('layout-command').style.display = 'none';
      document.getElementById('layout-classic').style.display = 'none';
      document.getElementById('layout-modern').style.display = 'none';
      
      const layoutType = document.getElementById('layout-selector').value;
      document.getElementById(`layout-${layoutType}`).style.display = 'block';
      routeDataToLayout(layoutType);
    }

    function loadPortalData() {
      document.getElementById('global-loader').style.display='block';
      google.script.run.withSuccessHandler(function(st) {
        globalState = st;
        document.getElementById('global-loader').style.display='none';
        routeDataToLayout(document.getElementById('layout-selector').value);
      }).getDashboardState();
    }

    function routeDataToLayout(layoutType) {
      if (!globalState) return;
      if (layoutType === 'command' && typeof renderCommandCenter === 'function') renderCommandCenter(globalState);
    }
  </script>
</body>
</html>
