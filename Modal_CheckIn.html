<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; color: #202124; background: #fafafa; }
    h3 { margin-top: 0; color: #188038; font-size: 18px; border-bottom: 2px solid #e8eaed; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5f6368; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #188038; box-shadow: 0 0 0 2px rgba(24,128,56,0.2); }
    .incident-card { background: #e6f4ea; border: 1px solid #ceead6; border-radius: 6px; padding: 10px; margin: 12px 0; font-size: 12px; line-height: 1.5; color: #137333; }
    .empty-state { padding: 30px; text-align: center; color: #5f6368; font-size: 14px; }
    .btn-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn { padding: 9px 18px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-success { background: #188038; color: #fff; }
    .btn-secondary { background: #f1f3f4; color: #3c4043; }
    .status-msg { margin-top: 8px; font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <h3>✅ Return Vehicle to Service</h3>

  <? if (!oosVehicles || oosVehicles.length === 0) { ?>
    <div class="empty-state">
      <p>🎉 All vehicles are currently active and in service!</p>
      <button class="btn btn-secondary" onclick="google.script.host.close()">Close</button>
    </div>
  <? } else { ?>
    <form id="checkInForm">
      <div class="form-group">
        <label>Select Out-of-Service Vehicle *</label>
        <select id="vehicleSelect" required onchange="onVehicleSelected()">
          <option value="">-- Choose Vehicle --</option>
          <? for (var i = 0; i < oosVehicles.length; i++) { ?>
            <option value="<?= oosVehicles[i].cleanName ?>" 
                    data-rental="<?= oosVehicles[i].rentalId ?>"
                    data-incident='<?= JSON.stringify(oosVehicles[i].incident || {}) ?>'>
              <?= oosVehicles[i].displayName ?>
            </option>
          <? } ?>
        </select>
      </div>

      <div id="incidentInfo" class="incident-card" style="display: none;">
        <strong>Open Issue Summary:</strong><br>
        <span id="incCategory"></span> &bull; <span id="incImpact"></span><br>
        <span id="incDesc" style="color: #3c4043;"></span>
      </div>

      <div class="form-group">
        <label>Resolution / Repairs Completed *</label>
        <textarea id="resolutionNotes" rows="3" placeholder="e.g. Tire patched at Discount Tire, tread verified, ready for route." required></textarea>
      </div>

      <div class="btn-bar">
        <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button type="submit" id="submitBtn" class="btn btn-success">Check In to Service</button>
      </div>
      <div id="status" class="status-msg"></div>
    </form>

    <script>
      let currentIncidentId = '';

      function onVehicleSelected() {
        const select = document.getElementById('vehicleSelect');
        const infoBox = document.getElementById('incidentInfo');
        if (!select.value) {
          infoBox.style.display = 'none';
          currentIncidentId = '';
          return;
        }

        const selectedOption = select.options[select.selectedIndex];
        const rawIncident = selectedOption.getAttribute('data-incident');
        const inc = rawIncident ? JSON.parse(rawIncident) : null;

        if (inc && inc.incidentId) {
          currentIncidentId = inc.incidentId;
          document.getElementById('incCategory').innerText = inc.issueCategory;
          document.getElementById('incImpact').innerText = inc.statusImpact;
          document.getElementById('incDesc').innerText = '"' + inc.description + '" (Reported ' + inc.dateReported + ')';
          infoBox.style.display = 'block';
        } else {
          currentIncidentId = '';
          infoBox.style.display = 'none';
        }
      }

      document.getElementById('checkInForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const select = document.getElementById('vehicleSelect');
        const selectedOption = select.options[select.selectedIndex];
        const rentalId = selectedOption.getAttribute('data-rental') || '';

        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        submitBtn.disabled = true;
        status.style.color = '#5f6368';
        status.innerText = 'Returning vehicle to active status...';

        const payload = {
          cleanName: select.value,
          rentalId: rentalId,
          incidentId: currentIncidentId,
          resolutionNotes: document.getElementById('resolutionNotes').value
        };

        google.script.run
          .withSuccessHandler(function(res) {
            status.style.color = '#137333';
            status.innerText = res.message;
            setTimeout(function() { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(function(err) {
            submitBtn.disabled = false;
            status.style.color = '#d93025';
            status.innerText = 'Error: ' + err.message;
            alert('Error: ' + err.message);
          })
          .processCheckInVehicle(payload);
      });
    </script>
  <? } ?>
</body>
</html>
