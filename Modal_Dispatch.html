<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; color: #202124; background: #fafafa; }
    h3 { margin-top: 0; color: #1a73e8; font-size: 18px; border-bottom: 2px solid #e8eaed; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5f6368; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }
    .empty-state { padding: 30px; text-align: center; color: #d93025; font-size: 14px; background: #fce8e6; border-radius: 6px; }
    .btn-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn { padding: 9px 18px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-secondary { background: #f1f3f4; color: #3c4043; }
    .status-msg { margin-top: 10px; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <h3>📋 Daily Driver & Shift Dispatch Checkout</h3>

  <? if (!vehicles || vehicles.length === 0) { ?>
    <div class="empty-state">
      <p>⚠️ No active or road-ready vehicles available for dispatch!</p>
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Close</button>
    </div>
  <? } else { ?>
    <form id="dispatchForm">
      <div class="form-group">
        <label>Select Vehicle (Active & In Service Only) *</label>
        <select id="vehicleSelect" required>
          <option value="">-- Choose Available Vehicle --</option>
          <? for (var i = 0; i < vehicles.length; i++) { ?>
            <option value="<?= vehicles[i].cleanName ?>" data-rental="<?= vehicles[i].rentalId ?>">
              <?= vehicles[i].displayName ?>
            </option>
          <? } ?>
        </select>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>Driver / Technician Name *</label>
          <input type="text" id="assignedTech" placeholder="e.g. John Doe / Tech ID" required />
        </div>
        <div class="col form-group">
          <label>Shift *</label>
          <select id="shift" required>
            <? for (var s = 0; s < shifts.length; s++) { ?>
              <option value="<?= shifts[s] ?>"><?= shifts[s] ?></option>
            <? } ?>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label>Assigned Work Zone *</label>
          <select id="workZone" required>
            <option value="">-- Select Zone --</option>
            <? for (var z = 0; z < zones.length; z++) { ?>
              <option value="<?= zones[z] ?>"><?= zones[z] ?></option>
            <? } ?>
          </select>
        </div>
        <div class="col form-group">
          <label>Battery Target / Outbound Load</label>
          <input type="text" id="batteryTarget" placeholder="e.g. 40 Swaps / 2 Pallets" />
        </div>
      </div>

      <div class="form-group">
        <label>Primary Shift Focus</label>
        <select id="focusCategory">
          <option value="">-- Select Focus (Optional) --</option>
          <? for (var f = 0; f < focusOptions.length; f++) { ?>
            <option value="<?= focusOptions[f] ?>"><?= focusOptions[f] ?></option>
          <? } ?>
        </select>
      </div>

      <div class="form-group">
        <label>Daily Focus & Operational Goals</label>
        <textarea id="goals" rows="3" placeholder="Target 35+ battery swaps, clear high-priority rebalance queue in OZ Group 2, retrieve damaged units..."></textarea>
      </div>

      <div class="btn-bar">
        <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button type="submit" id="submitBtn" class="btn btn-primary">Dispatch Vehicle</button>
      </div>
      <div id="status" class="status-msg"></div>
    </form>

    <script>
      document.getElementById('dispatchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const select = document.getElementById('vehicleSelect');
        if (!select.value) {
          alert('Please select a vehicle.');
          return;
        }

        const selectedOption = select.options[select.selectedIndex];
        const cleanName = select.value;
        const rentalId = selectedOption ? (selectedOption.getAttribute('data-rental') || '') : '';

        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        submitBtn.disabled = true;
        status.style.color = '#5f6368';
        status.innerText = 'Dispatching vehicle and updating roster...';

        const payload = {
          cleanName: cleanName,
          rentalId: rentalId,
          assignedTech: document.getElementById('assignedTech').value,
          shift: document.getElementById('shift').value,
          workZone: document.getElementById('workZone').value,
          batteryTarget: document.getElementById('batteryTarget').value,
          focusCategory: document.getElementById('focusCategory').value,
          goals: document.getElementById('goals').value
        };

        google.script.run
          .withSuccessHandler(function(res) {
            status.style.color = '#137333';
            status.innerText = res.message;
            setTimeout(function() { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(function(err) {
            submitBtn.disabled = false;
            status.style.color = '#d93025';
            status.innerText = 'Error: ' + (err.message || err);
            alert('Error: ' + (err.message || err));
          })
          .processDispatchCheckout(payload);
      });
    </script>
  <? } ?>
</body>
</html>
