<style>
  /* Base Variables - Light Theme (Default) */
  :root {
    --bg-main: #f8f9fa;
    --bg-surface: #ffffff;
    --bg-surface-hover: #f1f3f4;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --border-color: #dadce0;
    
    /* Functional Colors */
    --color-ready: #1e8e3e;     /* Warehouse Ready */
    --color-dispatched: #1a73e8; /* On Route */
    --color-oos: #d93025;       /* Out of Service */
    --color-warning: #f29900;   /* Returning Soon */
    
    /* VEO Brand Highlight */
    --brand-primary: #00E5FF;
    --brand-dark: #00B8D4;
    
    --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  /* Dark Theme Override */
  [data-theme="dark"] {
    --bg-main: #121212;
    --bg-surface: #1e1e1e;
    --bg-surface-hover: #2d2d2d;
    --text-primary: #e8eaed;
    --text-secondary: #9aa0a6;
    --border-color: #3c4043;
    
    --color-ready: #81c995;
    --color-dispatched: #8ab4f8;
    --color-oos: #f28b82;
    --color-warning: #fdd663;
    
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.5);
  }

  /* VEO Dynamic Theme Override (High Contrast Neon) */
  [data-theme="dynamic"] {
    --bg-main: #0a0a0a;
    --bg-surface: #141414;
    --bg-surface-hover: #1f1f1f;
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --border-color: #333333;
    
    --color-ready: #00E5FF;      /* VEO Cyan for Ready */
    --color-dispatched: #B388FF; /* Deep Purple for Active */
    --color-oos: #FF1744;        /* Neon Red for OOS */
    --color-warning: #FFEA00;    /* Neon Yellow */
    
    --shadow-sm: 0 0 10px rgba(0, 229, 255, 0.1);
    --shadow-md: 0 0 15px rgba(0, 229, 255, 0.15);
  }

  /* Global Reset & Typography */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Utility Classes */
  .badge {
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-ready { background: rgba(30, 142, 62, 0.1); color: var(--color-ready); }
  .badge-dispatched { background: rgba(26, 115, 232, 0.1); color: var(--color-dispatched); }
  .badge-oos { background: rgba(217, 48, 37, 0.1); color: var(--color-oos); }
  
  [data-theme="dark"] .badge-ready, [data-theme="dynamic"] .badge-ready { background: rgba(129, 201, 149, 0.2); }
  [data-theme="dark"] .badge-dispatched, [data-theme="dynamic"] .badge-dispatched { background: rgba(138, 180, 248, 0.2); }
  [data-theme="dark"] .badge-oos, [data-theme="dynamic"] .badge-oos { background: rgba(242, 139, 130, 0.2); }

  /* App Layout Structure */
  .app-container {
    display: flex;
    width: 100%;
    height: 100%;
  }

  .sidebar {
    width: 260px;
    background-color: var(--bg-surface);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease;
    z-index: 100;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    height: 64px;
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }

  .layout-canvas {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    background-color: var(--bg-main);
  }
</style>
