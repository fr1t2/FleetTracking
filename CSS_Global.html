<style>
  :root {
    --veo-cyan: #00E5FF; --veo-cyan-dark: #00B8CC;
    --bg-main: #f4f7f6; --bg-surface: #ffffff; --bg-panel: #f8fafc;
    --text-main: #111111; --text-muted: #666666; --border-color: #e2e8f0;
    --sidebar-bg: #111111; --sidebar-text: #ffffff; --sidebar-hover: #222222;
    --danger: #ff3b30; --warning: #ffcc00; --success: #34c759;
    --shadow: 0 4px 12px rgba(0,0,0,0.05); --radius: 8px;
  }
  [data-theme="dark"] {
    --bg-main: #0a0a0c; --bg-surface: #141417; --bg-panel: #1c1c1f;
    --text-main: #f5f5f7; --text-muted: #a1a1a6; --border-color: #2c2c30;
    --sidebar-bg: #111111; --sidebar-text: #ffffff; --sidebar-hover: #2a2a2a;
    --shadow: 0 4px 12px rgba(0,0,0,0.4);
  }
  [data-theme="veo-dynamic"] {
    --bg-main: #000000; --bg-surface: #0a0a0a; --bg-panel: #111111;
    --text-main: #ffffff; --text-muted: #888888; --border-color: #00E5FF;
    --status-ready: #00ff73; --status-active: #00E5FF; --status-oos: #ff003c; --status-warn: #ffae00;
    --shadow: 0 0 20px rgba(0, 229, 255, 0.15); --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { width: 260px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; transition: 0.3s; z-index: 50; }
  .sidebar.collapsed { width: 70px; }
  .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 20px; color: var(--veo-cyan); }
  .menu-toggle { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .nav-menu { flex: 1; padding: 10px 0; display: flex; flex-direction: column; gap: 4px; }
  .nav-item { padding: 12px 20px; color: #aaa; text-decoration: none; display: flex; align-items: center; gap: 16px; font-weight: 600; cursor: pointer; border-left: 4px solid transparent; }
  .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--veo-cyan); border-left-color: var(--veo-cyan); }
  .sidebar-footer { padding: 20px; border-top: 1px solid #333; }
  .theme-toggle { background: #222; border: 1px solid #444; color: #fff; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  /* MAIN CONTENT & TABS */
  .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 40; box-shadow: var(--shadow); }
  .content-area { flex: 1; position: relative; overflow-y: auto; }
  
  .tab-content { display: none; height: 100%; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* UI CONTROLS */
  .system-controls { display: flex; gap: 10px; align-items: center; }
  .control-select { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; outline: none; }
  .btn { border: none; padding: 10px 16px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
  .btn-primary { background: var(--veo-cyan); color: #000; }
  .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
  .btn-dark { background: #111; color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }

  /* STANDARD PANELS & CARDS (Used in Fleet/Techs/History) */
  .panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; margin: 24px; box-shadow: var(--shadow); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  
  .k-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; cursor: pointer; border-left: 4px solid var(--border-color); box-shadow: var(--shadow); }
  .k-card.ready { border-left-color: var(--status-ready); }
  .k-card.active { border-left-color: var(--status-active); }
  .k-card.oos { border-left-color: var(--status-oos); }
  .k-title { font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items:center; }
  .k-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; margin: 4px 0 8px; }
  .zone-badge { background: rgba(0, 229, 255, 0.1); color: var(--veo-cyan-dark); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; }

  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--bg-surface); width: 100%; max-width: 540px; border-radius: var(--radius); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; }
  .modal-close { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer { padding: 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; background: var(--bg-main); border-radius: 0 0 var(--radius) var(--radius);}
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-main); color: var(--text-main); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .loader-bar { display:none; height:4px; width:100%; background:var(--veo-cyan); position:absolute; top:0; left:0; z-index:999; animation: loading 1.5s infinite; }
  @keyframes loading { 0% { transform: translateX(-100%); width: 30%; } 50% { transform: translateX(100%); width: 70%; } 100% { transform: translateX(300%); width: 30%; } }
</style>
