<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; color: #202124; background: #fafafa; }
    h3 { margin-top: 0; color: #d93025; font-size: 18px; border-bottom: 2px solid #e8eaed; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #5f6368; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #d93025; box-shadow: 0 0 0 2px rgba(217,48,37,0.2); }
    .notice-box { background: #fce8e6; border: 1px solid #fad2cf; padding: 10px; border-radius: 6px; margin: 12px 0; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input { width: auto; margin: 0; }
    .checkbox-row label { font-size: 13px; font-weight: 600; color: #c5221f; margin: 0; cursor: pointer; }
    .btn-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn { padding: 9px 18px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-secondary { background: #f1f3f4; color: #3c4043; }
    .status-msg { margin-top: 10px; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <h3>⚠️ Report Vehicle Incident / Service</h3>
  <form id="incidentForm">
    <div class="form-group">
      <label>Select Vehicle *</label>
      <select id="vehicleSelect" required>
        <option value="">-- Choose Vehicle --</option>
        <? for (var i = 0; i < vehicles.length; i++) { ?>
          <option value="<?= vehicles[i].cleanName ?>" data-rental="<?= vehicles[i].rentalId ?>">
            <?= vehicles[i].displayName ?>
          </option>
        <? } ?>
      </select>
    </div>

    <div class="form-group">
      <label>1. Issue Category (What happened?) *</label>
      <select id="issueCategory" required>
        <? for (var j = 0; j < issueCategories.length; j++) { ?>
          <option value="<?= issueCategories[j] ?>"><?= issueCategories[j] ?></option>
        <? } ?>
      </select>
    </div>

    <div class="form-group">
      <label>2. Status Impact (Operational disposition) *</label>
      <select id="statusImpact" required>
        <? for (var k = 0; k < statusImpacts.length; k++) { ?>
          <option value="<?= statusImpacts[k] ?>"><?= statusImpacts[k] ?></option>
        <? } ?>
      </select>
    </div>

    <div class="notice-box">
      <div class="checkbox-row">
        <input type="checkbox" id="triggerOos" checked />
        <label for="triggerOos">🚨 Immediately set vehicle to "Out of Service"</label>
      </div>
    </div>

    <div class="form-group">
      <label>Description & Event Details *</label>
      <textarea id="description" rows="3" placeholder="Explain what occurred, driver remarks, warning codes, or parts needed..." required></textarea>
    </div>

    <div class="btn-bar">
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" id="submitBtn" class="btn btn-danger">Submit Report</button>
    </div>
    <div id="status" class="status-msg"></div>
  </form>

  <script>
    document.getElementById('incidentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const select = document.getElementById('vehicleSelect');
      if (!select.value) {
        alert('Please choose a vehicle first.');
        return;
      }

      const selectedOption = select.options[select.selectedIndex];
      const cleanName = select.value;
      const rentalId = selectedOption ? (selectedOption.getAttribute('data-rental') || '') : '';

      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      submitBtn.disabled = true;
      status.style.color = '#5f6368';
      status.innerText = 'Submitting incident and updating vehicle status...';

      const payload = {
        cleanName: cleanName,
        rentalId: rentalId,
        issueCategory: document.getElementById('issueCategory').value,
        statusImpact: document.getElementById('statusImpact').value,
        triggerOos: document.getElementById('triggerOos').checked,
        description: document.getElementById('description').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          status.style.color = '#137333';
          status.innerText = res.message;
          setTimeout(function() { google.script.host.close(); }, 1200);
        })
        .withFailureHandler(function(err) {
          submitBtn.disabled = false;
          status.style.color = '#d93025';
          status.innerText = 'Submission failed: ' + (err.message || err);
          alert('Submission failed: ' + (err.message || err));
        })
        .processReportIncident(payload);
    });
  </script>
</body>
</html>
