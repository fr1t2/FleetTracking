<style>
  .mod-wrap { padding: 24px; height: 100%; overflow-y: auto; background: var(--bg-main); }
  .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; max-width: 1600px; margin: 0 auto; }
  
  .mod-widget { background: var(--bg-surface); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display:flex; flex-direction:column; gap:16px;}
  .mod-head { font-size: 18px; font-weight: 800; color: var(--text-main); display:flex; justify-content:space-between; align-items:center; }
  .mod-kpi { font-size: 52px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
  
  .mod-list { display:flex; flex-direction:column; gap:12px; max-height:450px; overflow-y:auto; padding-right:8px; }
  .mod-item { background: var(--bg-panel); border-radius: 12px; padding: 16px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border-color); cursor:pointer; transition:0.15s; }
  .mod-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--veo-cyan); }
</style>

<div class="mod-wrap">
  <div class="mod-grid">
    <!-- Active Route Widget -->
    <div class="mod-widget" style="border-top: 4px solid var(--veo-cyan);">
      <div class="mod-head"><span>Live Routes</span><span class="mod-kpi" id="mod-kpi-act" style="color:var(--veo-cyan);">0</span></div>
      <div class="mod-list" id="mod-list-act"></div>
    </div>
    
    <!-- Ready Fleet Widget -->
    <div class="mod-widget" style="border-top: 4px solid var(--success);">
      <div class="mod-head"><span>Ready Fleet</span><span class="mod-kpi" id="mod-kpi-rdy" style="color:var(--success);">0</span></div>
      <div class="mod-list" id="mod-list-rdy"></div>
    </div>
    
    <!-- OOS Widget -->
    <div class="mod-widget" style="border-top: 4px solid var(--danger);">
      <div class="mod-head"><span>Needs Attention</span><span class="mod-kpi" id="mod-kpi-oos" style="color:var(--danger);">0</span></div>
      <div class="mod-list" id="mod-list-oos"></div>
    </div>
  </div>
</div>

<script>
  function renderModernWidgets() {
    if(!globalState) return;
    const rdy = globalState.vehicles.filter(v=>v.status==='Warehouse (Ready)');
    const act = globalState.deployments.filter(d=>d.status==='Dispatched');
    const oos = globalState.vehicles.filter(v=>v.status==='Out of Service');

    document.getElementById('mod-kpi-rdy').innerText = rdy.length;
    document.getElementById('mod-kpi-act').innerText = act.length;
    document.getElementById('mod-kpi-oos').innerText = oos.length;

    document.getElementById('mod-list-act').innerHTML = act.length ? act.map(d=>`<div class="mod-item" onclick="openVanActionModal('${d.rentalId}')">
      <div><div style="font-weight:800; font-size:15px;">${d.coDriver ? d.tech+' & '+d.coDriver : d.tech}</div><div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${d.vehicle} &bull; ${d.zone}</div></div>
      <div style="text-align:right;"><div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Time Out</div><div style="font-weight:800; color:var(--veo-cyan-dark);">${d.departureTime}</div></div>
    </div>`).join('') : '<div style="color:var(--text-muted); text-align:center; padding:30px; font-weight:600;">No active routes.</div>';

    document.getElementById('mod-list-rdy').innerHTML = rdy.length ? rdy.map(v=>`<div class="mod-item" onclick="openVanActionModal('${v.rentalId}')">
      <div><div style="font-weight:800; font-size:15px;">${v.cleanName}</div><div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Plate: ${v.plate}</div></div>
      <button class="btn btn-outline" style="padding:6px 12px; font-size:11px;" onclick="event.stopPropagation(); prefillDispatchVan('${v.cleanName}')">Deploy</button>
    </div>`).join('') : '<div style="color:var(--text-muted); text-align:center; padding:30px; font-weight:600;">No available vans.</div>';

    document.getElementById('mod-list-oos').innerHTML = oos.length ? oos.map(v=>`<div class="mod-item" onclick="openVanActionModal('${v.rentalId}')">
      <div><div style="font-weight:800; font-size:15px;">${v.cleanName}</div><div style="font-size:12px; color:var(--danger); font-weight:600; margin-top:4px;">${v.notes||'Repair Needed'}</div></div>
      <button class="btn btn-outline" style="padding:6px 12px; font-size:11px; border-color:var(--danger); color:var(--danger);" onclick="event.stopPropagation(); prefillCheckInVan('${v.cleanName}')">Fix</button>
    </div>`).join('') : '<div style="color:var(--success); text-align:center; padding:30px; font-weight:800;">Fleet is 100% healthy!</div>';
  }
</script>
