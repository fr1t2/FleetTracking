<style>
  .cmd-container { display: flex; height: 100%; width: 100%; background: var(--bg-main); }
  
  /* LEFT SIDEBAR: FLEET ROSTER */
  .cmd-sidebar { width: 360px; background: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 5; }
  .cmd-sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
  .cmd-search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; }
  .cmd-search:focus { border-color: var(--veo-cyan); box-shadow: 0 0 0 3px rgba(0,229,255,0.1); }
  
  .cmd-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .cmd-van-card { padding: 14px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid transparent; transition: all 0.15s ease; }
  .cmd-van-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .cmd-van-card.active { background: var(--bg-panel); border-left-color: var(--veo-cyan); border-right: 1px solid var(--veo-cyan); border-top: 1px solid var(--veo-cyan); border-bottom: 1px solid var(--veo-cyan); }
  
  /* RIGHT PANE: ACTION SPACE */
  .cmd-main { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; }
  .cmd-action-box { width: 100%; max-width: 850px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); position: relative; }
  
  /* STATUS INDICATORS */
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .st-ready { background: var(--status-ready); box-shadow: 0 0 8px var(--status-ready); }
  .st-route { background: var(--status-active); box-shadow: 0 0 8px var(--status-active); }
  .st-oos { background: var(--status-oos); box-shadow: 0 0 8px var(--status-oos); }

  /* FORMS */
  .cmd-form { background: var(--bg-panel); padding: 24px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 24px; animation: slideDown 0.3s ease; }
  @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
  .cmd-form-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .cmd-form-group { flex: 1; }
  .cmd-form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
  .cmd-form-group select, .cmd-form-group input, .cmd-form-group textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); font-size: 14px; outline: none; }
  .cmd-form-group select:focus, .cmd-form-group input:focus { border-color: var(--veo-cyan); }
</style>

<div class="cmd-container">
  
  <!-- LEFT: FLEET ROSTER -->
  <div class="cmd-sidebar">
    <div class="cmd-sidebar-header">
      <input type="text" id="cmd-search" class="cmd-search" placeholder="🔍 Search Fleet (Van or Plate)..." onkeyup="renderCommandList()">
    </div>
    <div class="cmd-list" id="cmd-list-container">
      <!-- Vans injected here -->
    </div>
  </div>
  
  <!-- RIGHT: ACTION SPACE -->
  <div class="cmd-main">
    <div id="cmd-action-pane" style="width:100%; display:flex; justify-content:center;">
      <div style="text-align:center; color:var(--text-muted); margin-top:30vh; font-weight:600;">
        <h2>Select a vehicle from the roster to begin dispatching.</h2>
      </div>
    </div>
  </div>

</div>

<!-- ================= HIDDEN FORM TEMPLATES ================= -->
<div style="display:none;">
  <!-- DISPATCH FORM -->
  <div id="cmd-tpl-dispatch">
    <form class="cmd-form" onsubmit="cmdSubmitDispatch(event)">
      <h3 style="margin-bottom:20px; font-size:16px; text-transform:uppercase; color:var(--veo-cyan);">📋 Dispatch Options</h3>
      <div class="cmd-form-row"><div class="cmd-form-group"><label>Lead Tech *</label><select id="cmd_tech" required></select></div><div class="cmd-form-group"><label>Shift *</label><select id="cmd_shift" required></select></div></div>
      <div class="cmd-form-row"><div class="cmd-form-group"><label>Co-Driver (Optional)</label><select id="cmd_codriver"></select></div><div class="cmd-form-group"><label style="margin-top:30px; display:flex; align-items:center; gap:8px;"><input type="checkbox" id="cmd_training" style="width:auto;"> 🎓 Training Route</label></div></div>
      <div class="cmd-form-row"><div class="cmd-form-group"><label>Work Zone *</label><select id="cmd_zone" required></select></div><div class="cmd-form-group"><label>Battery Target</label><input type="text" id="cmd_target"></div></div>
      <div class="cmd-form-group" style="margin-bottom:16px;"><label>Focus</label><select id="cmd_focus"></select></div>
      <div class="cmd-form-group" style="margin-bottom:24px;"><label>Goals</label><textarea id="cmd_goals" rows="2"></textarea></div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:16px;">🚀 DEPLOY VAN</button>
    </form>
  </div>

  <!-- REPORT OOS FORM -->
  <div id="cmd-tpl-incident">
    <form class="cmd-form" onsubmit="cmdSubmitIncident(event)">
      <h3 style="margin-bottom:20px; font-size:16px; text-transform:uppercase; color:var(--status-oos);">⚠️ Report Breakdown</h3>
      <div class="cmd-form-row"><div class="cmd-form-group"><label>Issue Category *</label><select id="cmd_inc_cat" required></select></div><div class="cmd-form-group"><label>Status Impact *</label><select id="cmd_inc_impact" required></select></div></div>
      <div class="cmd-form-group" style="margin-bottom:16px;"><label style="display:flex; align-items:center; gap:8px; color:var(--status-oos);"><input type="checkbox" id="cmd_inc_oos" checked style="width:auto;" /> 🚨 Set vehicle to "Out of Service"</label></div>
      <div class="cmd-form-group" style="margin-bottom:24px;"><label>Event Description *</label><textarea id="cmd_inc_desc" rows="3" required></textarea></div>
      <button type="submit" class="btn" style="width:100%; padding:14px; font-size:16px; background:var(--status-oos); color:#fff;">LOG ISSUE</button>
    </form>
  </div>

  <!-- CHECK IN FORM -->
  <div id="cmd-tpl-checkin">
    <form class="cmd-form" onsubmit="cmdSubmitCheckIn(event)">
      <h3 style="margin-bottom:20px; font-size:16px; text-transform:uppercase; color:var(--status-ready);">✅ Return to Service</h3>
      <div class="cmd-form-group" style="margin-bottom:24px;"><label>Resolution & Repairs Completed *</label><textarea id="cmd_ci_notes" rows="3" required></textarea></div>
      <button type="submit" class="btn" style="width:100%; padding:14px; font-size:16px; background:var(--status-ready); color:#000;">CHECK IN VAN</button>
    </form>
  </div>
</div>

<!-- ================= JAVASCRIPT: COMMAND CENTER ================= -->
<script>
  let cmdSelectedVan = null;

  function renderCommandCenter(state) {
    cmdPopulateHiddenForms(); // Build the dropdown menus in the background first
    renderCommandList();
    if(cmdSelectedVan) cmdSelectVan(cmdSelectedVan);
  }

  // Populate form dropdowns using the master config array
  function cmdPopulateHiddenForms() {
    const cfg = globalState.config;
    let rOpts = '<option value="">-- Select --</option>' + cfg.techRoster.map(r=>`<option value="${r}">${r}</option>`).join('');
    document.getElementById('cmd_tech').innerHTML = rOpts;
    document.getElementById('cmd_codriver').innerHTML = rOpts;
    document.getElementById('cmd_shift').innerHTML = cfg.shifts.map(s=>`<option value="${s}">${s}</option>`).join('');
    document.getElementById('cmd_zone').innerHTML = '<option value="">-- Zone --</option>' + cfg.zones.map(z=>`<option value="${z}">${z}</option>`).join('');
    document.getElementById('cmd_focus').innerHTML = '<option value="">-- Focus --</option>' + cfg.focusOptions.map(f=>`<option value="${f}">${f}</option>`).join('');
    document.getElementById('cmd_inc_cat').innerHTML = cfg.issueCategories.map(c=>`<option value="${c}">${c}</option>`).join('');
    document.getElementById('cmd_inc_impact').innerHTML = cfg.statusImpacts.map(i=>`<option value="${i}">${i}</option>`).join('');
  }

  // Render the left Sidebar Roster
  function renderCommandList() {
    const q = document.getElementById('cmd-search').value.toLowerCase();
    const container = document.getElementById('cmd-list-container');
    let html = '';
    
    // Sort: Dispatched first, then OOS, then Ready
    let vans = [...globalState.vehicles];
    vans.sort((a,b) => {
       const w = {"Dispatched":1, "Out of Service":2, "Warehouse (Ready)":3};
       return (w[a.status]||4) - (w[b.status]||4);
    });

    vans.forEach(v => {
      if(v.status === 'Decommissioned') return;
      if(q && !v.cleanName.toLowerCase().includes(q) && !v.plate.toLowerCase().includes(q)) return;
      
      let dotClass = v.status==='Warehouse (Ready)' ? 'st-ready' : (v.status==='Dispatched' ? 'st-route' : 'st-oos');
      let activeCls = cmdSelectedVan === v.rentalId ? 'active' : '';
      
      html += `<div class="cmd-van-card ${activeCls}" onclick="cmdSelectVan('${v.rentalId}')">
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:14px;">
          <span><span class="status-dot ${dotClass}"></span>${v.cleanName}</span>
          <span style="font-size:11px; color:var(--text-muted); font-weight:600;">${v.rentalId}</span>
        </div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:2px; font-weight:500;">
          ${v.status === 'Dispatched' ? '🚙 ' + v.driver + ' | ' + v.zone : (v.status === 'Out of Service' ? '🚨 Down for Repair' : '🟢 Ready at Warehouse')}
        </div>
      </div>`;
    });
    container.innerHTML = html;
  }

  // When a Van is clicked, render the massive details pane on the right
  function cmdSelectVan(rentalId) {
    cmdSelectedVan = rentalId;
    renderCommandList(); // Refresh the list to highlight the active card
    
    const v = globalState.vehicles.find(x => x.rentalId === rentalId);
    if(!v) return;
    const pane = document.getElementById('cmd-action-pane');
    
    // Header Block
    let html = `<div class="cmd-action-box">
      <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color); padding-bottom:24px; margin-bottom:24px;">
        <div>
          <h1 style="font-size:32px; font-weight:900; letter-spacing:-0.5px;">${v.cleanName}</h1>
          <div style="color:var(--text-muted); font-weight:600; margin-top:6px; font-size:14px;">${v.makeModel} &bull; Plate: <span style="color:var(--text-main);">${v.plate}</span> &bull; Samsara: <span style="color:var(--text-main);">${v.samsaraSerial}</span></div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:20px; font-weight:900; letter-spacing:1px; color:${v.status==='Warehouse (Ready)'?'var(--status-ready)':(v.status==='Dispatched'?'var(--status-active)':'var(--status-oos)')};">${v.status.toUpperCase()}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:6px; font-weight:600;">Last Service: ${v.lastService}</div>
        </div>
      </div>`;
      
    // Action Buttons based on status
    if (v.status === 'Warehouse (Ready)') {
       html += `<div style="display:flex; gap:16px;">
         <button class="btn btn-primary" style="flex:3; padding:18px; font-size:16px;" onclick="cmdRenderForm('dispatch')">📋 DISPATCH VAN</button>
         <button class="btn btn-outline" style="flex:1; color:var(--status-oos); border-color:var(--status-oos);" onclick="cmdRenderForm('incident')">⚠️ REPORT OOS</button>
       </div>`;
    } 
    else if (v.status === 'Dispatched') {
       const dep = globalState.deployments.find(d => d.rentalId === v.rentalId && d.status === 'Dispatched');
       html += `<div style="background:var(--bg-panel); padding:24px; border-radius:8px; border:1px solid var(--border-color); margin-bottom:24px;">
          <h3 style="margin-bottom:16px; font-size:14px; text-transform:uppercase; color:var(--veo-cyan); font-weight:800; letter-spacing:1px;">Active Shift Details</h3>
          <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:15px;"><span><strong>Driver:</strong> ${dep?dep.tech:'Unknown'} ${dep&&dep.coDriver ? '& '+dep.coDriver : ''}</span> <span><strong>Out Since:</strong> ${dep?dep.departureTime:'--'}</span></div>
          <div style="display:flex; justify-content:space-between; font-size:15px; color:var(--text-muted);"><span><strong>Zone:</strong> ${dep?dep.zone:'--'}</span> <span><strong>Goals:</strong> ${dep?dep.goals:'--'}</span></div>
       </div>
       <div style="display:flex; gap:16px;">
         <button class="btn btn-outline" style="flex:3; padding:18px; font-size:16px;" onclick="cmdEndShift('${dep?dep.id:''}', '${v.rentalId}')">🛑 END SHIFT & RETURN TO READY</button>
         <button class="btn btn-outline" style="flex:1; color:var(--status-oos); border-color:var(--status-oos);" onclick="cmdRenderForm('incident')">⚠️ REPORT OOS</button>
       </div>`;
    }
    else if (v.status === 'Out of Service') {
       html += `<div style="background:rgba(255, 59, 48, 0.05); padding:24px; border-radius:8px; border:1px solid var(--status-oos); margin-bottom:24px;">
          <h3 style="margin-bottom:12px; font-size:14px; text-transform:uppercase; color:var(--status-oos); font-weight:800; letter-spacing:1px;">Active Incident</h3>
          <div style="font-weight:600; font-size:15px;">${v.notes}</div>
       </div>
       <button class="btn" style="width:100%; padding:18px; font-size:16px; background:var(--status-ready); color:#000;" onclick="cmdRenderForm('checkin')">✅ REPAIRS COMPLETE - CHECK IN</button>`;
    }
    
    html += `<div id="cmd-form-area"></div></div>`;
    pane.innerHTML = html;
  }

  // Inject the chosen form into the right pane
  function cmdRenderForm(type) {
    const area = document.getElementById('cmd-form-area');
    area.innerHTML = document.getElementById(`cmd-tpl-${type}`).innerHTML;
  }

  /* --- SUBMISSION ACTIONS (Optimistic UI & Conflict Resolution) --- */

  function cmdSubmitDispatch(e) {
    e.preventDefault();
    const assignedTech = document.getElementById('cmd_tech').value;
    const coDriver = document.getElementById('cmd_codriver').value;
    const v = globalState.vehicles.find(x => x.rentalId === cmdSelectedVan);

    if (assignedTech === coDriver && assignedTech !== '') { alert("Lead tech and co-driver cannot be the same person."); return; }

    // Verify Conflict Rules (Single Van / Single Driver)
    const activeDeps = globalState.deployments.filter(d => d.status === 'Dispatched');
    let conflicts = [], warnings = [];
    activeDeps.forEach(d => {
      let isC = false, rsn = [];
      if (d.rentalId === v.rentalId) { isC = true; rsn.push(`Van ${v.cleanName} is assigned to ${d.tech}`); }
      if (d.tech === assignedTech || (d.coDriver && d.coDriver === assignedTech)) { isC = true; rsn.push(`${assignedTech} is driving ${d.vehicle}`); }
      if (coDriver && (d.tech === coDriver || (d.coDriver && d.coDriver === coDriver))) { isC = true; rsn.push(`${coDriver} is driving ${d.vehicle}`); }
      if (isC) { conflicts.push(d); warnings.push("⚠️ " + rsn.join(" AND ")); }
    });
    warnings = [...new Set(warnings)];
    if (warnings.length > 0) { if (!confirm("CONFLICTS DETECTED:\n\n" + warnings.join("\n") + "\n\nEnd active shifts and re-deploy?")) return; }

    const p = {
      cleanName: v.cleanName, rentalId: v.rentalId, assignedTech: assignedTech, coDriver: coDriver,
      isTraining: document.getElementById('cmd_training').checked, shift: document.getElementById('cmd_shift').value,
      workZone: document.getElementById('cmd_zone').value, batteryTarget: document.getElementById('cmd_target').value,
      focusCategory: document.getElementById('cmd_focus').value, goals: document.getElementById('cmd_goals').value
    };

    // Optimistic UI updates
    const now = new Date();
    const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

    conflicts.forEach(c => {
      c.status = 'Completed'; c.returnTime = timeString;
      if (c.rentalId !== p.rentalId) { const oldV = globalState.vehicles.find(x => x.rentalId === c.rentalId); if (oldV) { oldV.status = 'Warehouse (Ready)'; oldV.zone = '—'; oldV.driver = '—'; } }
    });

    globalState.deployments.unshift({ id:'...', date: now.toISOString().split('T')[0], shift: p.shift, vehicle: p.cleanName, rentalId: p.rentalId, tech: p.assignedTech, zone: p.workZone, status: 'Dispatched', departureTime: timeString, coDriver: p.coDriver, isTraining: p.isTraining });
    v.status = 'Dispatched'; v.zone = p.workZone; v.driver = p.coDriver ? `${p.assignedTech} & ${p.coDriver}` : p.assignedTech;

    renderCommandCenter(globalState);
    document.getElementById('global-loader').style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).processDispatchCheckout(p);
  }

  function cmdEndShift(depId, rentId) {
    if(!confirm("End shift?")) return;
    const dIdx = globalState.deployments.findIndex(d=>d.id===depId);
    if(dIdx > -1) { globalState.deployments[dIdx].status = 'Completed'; globalState.deployments[dIdx].returnTime = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    const vIdx = globalState.vehicles.findIndex(x=>x.rentalId===rentId);
    if(vIdx > -1) { globalState.vehicles[vIdx].status = 'Warehouse (Ready)'; globalState.vehicles[vIdx].driver = '—'; globalState.vehicles[vIdx].zone = '—'; }
    
    renderCommandCenter(globalState);
    document.getElementById('global-loader').style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).endShift(depId, rentId);
  }

  function cmdSubmitIncident(e) {
    e.preventDefault();
    const p = {
      cleanName: globalState.vehicles.find(x=>x.rentalId===cmdSelectedVan).cleanName, rentalId: cmdSelectedVan,
      issueCategory: document.getElementById('cmd_inc_cat').value, statusImpact: document.getElementById('cmd_inc_impact').value,
      triggerOos: document.getElementById('cmd_inc_oos').checked, description: document.getElementById('cmd_inc_desc').value
    };
    if(p.triggerOos) {
      const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const v = globalState.vehicles.find(x=>x.rentalId===p.rentalId);
      if(v) { v.status = 'Out of Service'; v.zone = '—'; v.driver = '—'; v.notes = p.issueCategory + ': ' + p.description; }
      const dIdx = globalState.deployments.findIndex(d => d.rentalId === p.rentalId && d.status === 'Dispatched');
      if (dIdx > -1) { globalState.deployments[dIdx].status = 'Completed'; globalState.deployments[dIdx].returnTime = timeString; }
      renderCommandCenter(globalState);
    }
    document.getElementById('global-loader').style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).processReportIncident(p);
  }

  function cmdSubmitCheckIn(e) {
    e.preventDefault();
    const p = { cleanName: globalState.vehicles.find(x=>x.rentalId===cmdSelectedVan).cleanName, rentalId: cmdSelectedVan, resolutionNotes: document.getElementById('cmd_ci_notes').value };
    const v = globalState.vehicles.find(x=>x.rentalId===p.rentalId);
    if(v) { v.status = 'Warehouse (Ready)'; v.notes = ''; }
    
    renderCommandCenter(globalState);
    document.getElementById('global-loader').style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).processCheckInVehicle(p);
  }
</script>
