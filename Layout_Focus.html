<style>
  .foc-wrap { padding: 24px; height: 100%; overflow-y: auto; background: var(--bg-main); display:flex; flex-direction:column; }
  .foc-lanes { display: flex; gap: 24px; flex: 1; min-height: 0; }
  .foc-lane { flex: 1; display: flex; flex-direction: column; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); overflow:hidden; box-shadow: var(--shadow); }
  
  .foc-lane-head { padding: 16px 20px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--border-color); background: var(--bg-panel); }
  .foc-lane-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-main); }
  
  .foc-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 16px; transition: 0.15s; border-left: 4px solid transparent; }
  .foc-card:hover { border-color: var(--veo-cyan); transform: translateY(-2px); box-shadow: var(--shadow); }
  
  .foc-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .foc-title { font-weight: 900; font-size: 16px; }
  .foc-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
  
  .foc-actions { display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 12px; }
  .foc-btn { flex: 1; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; border: none; transition: 0.2s; text-align: center; }
  
  .foc-btn-pri { background: var(--veo-cyan); color: #000; }
  .foc-btn-pri:hover { filter: brightness(1.1); }
  .foc-btn-sec { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); }
  .foc-btn-sec:hover { background: var(--border-color); }
  .foc-btn-warn { background: rgba(255, 59, 48, 0.1); color: var(--danger); border: 1px solid rgba(255, 59, 48, 0.2); }
</style>

<div class="foc-wrap">
  <div class="foc-lanes">
    <!-- Ready Lane -->
    <div class="foc-lane">
      <div class="foc-lane-head" style="border-bottom-color:var(--success);">
        <span style="color:var(--success);">Available (Ready)</span><span id="foc-cnt-rdy">0</span>
      </div>
      <div class="foc-lane-body" id="foc-body-rdy"></div>
    </div>
    
    <!-- Active Lane -->
    <div class="foc-lane">
      <div class="foc-lane-head" style="border-bottom-color:var(--veo-cyan);">
        <span style="color:var(--veo-cyan-dark);">Active On Route</span><span id="foc-cnt-act">0</span>
      </div>
      <div class="foc-lane-body" id="foc-body-act"></div>
    </div>
    
    <!-- OOS Lane -->
    <div class="foc-lane">
      <div class="foc-lane-head" style="border-bottom-color:var(--danger);">
        <span style="color:var(--danger);">Out of Service</span><span id="foc-cnt-oos">0</span>
      </div>
      <div class="foc-lane-body" id="foc-body-oos"></div>
    </div>
  </div>
</div>

<script>
  function renderFocusOperations() {
    if(!globalState) return;
    const rdy = globalState.vehicles.filter(v=>v.status==='Warehouse (Ready)');
    const act = globalState.deployments.filter(d=>d.status==='Dispatched');
    const oos = globalState.vehicles.filter(v=>v.status==='Out of Service');

    document.getElementById('foc-cnt-rdy').innerText = rdy.length;
    document.getElementById('foc-cnt-act').innerText = act.length;
    document.getElementById('foc-cnt-oos').innerText = oos.length;

    // READY
    document.getElementById('foc-body-rdy').innerHTML = rdy.map(v=>`<div class="foc-card" style="border-left-color:var(--success);">
      <div class="foc-card-top">
        <div><div class="foc-title">${v.cleanName}</div><div class="foc-sub">${v.rentalId} &bull; ${v.makeModel}</div></div>
      </div>
      <div class="foc-actions">
        <button class="foc-btn foc-btn-pri" onclick="prefillDispatchVan('${v.cleanName}')">Deploy Van</button>
        <button class="foc-btn foc-btn-warn" onclick="prefillIncidentVan('${v.cleanName}')">Mark OOS</button>
      </div>
    </div>`).join('');

    // ACTIVE
    document.getElementById('foc-body-act').innerHTML = act.map(d=>`<div class="foc-card" style="border-left-color:var(--veo-cyan);">
      <div class="foc-card-top">
        <div><div class="foc-title">${d.vehicle}</div><div class="foc-sub">👤 ${d.coDriver ? d.tech+' & '+d.coDriver : d.tech}</div></div>
        <div style="text-align:right;"><div style="font-weight:800; font-size:12px; color:var(--veo-cyan-dark);">${d.zone}</div><div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Out: ${d.departureTime}</div></div>
      </div>
      <div class="foc-actions">
        <button class="foc-btn foc-btn-sec" onclick="endShift('${d.id}', '${d.rentalId}')">End Shift</button>
        <button class="foc-btn foc-btn-sec" onclick="openEditDispatchModal('${d.id}')">Edit</button>
      </div>
    </div>`).join('');

    // OOS
    document.getElementById('foc-body-oos').innerHTML = oos.map(v=>`<div class="foc-card" style="border-left-color:var(--danger);">
      <div class="foc-card-top">
        <div><div class="foc-title">${v.cleanName}</div><div class="foc-sub" style="color:var(--danger);">${v.notes||'Repair Needed'}</div></div>
      </div>
      <div class="foc-actions">
        <button class="foc-btn foc-btn-sec" style="color:var(--success); border-color:var(--success);" onclick="prefillCheckInVan('${v.cleanName}')">Fix & Check In</button>
        <button class="foc-btn foc-btn-sec" onclick="openEditVehicleModal('${v.rentalId}')">Notes</button>
      </div>
    </div>`).join('');
  }
</script>
