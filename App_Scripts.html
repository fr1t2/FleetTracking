<!-- Injecting structural, compact, and mobile responsive constraints -->
<style>
  /* --- TOP NAVIGATION BAR OVERRIDES --- */
  .nav-tabs {
    display: flex !important;
    gap: 4px !important;
    border-bottom: 1px solid var(--border-color) !important;
    background: transparent !important;
    padding: 0 !important;
    margin-bottom: 20px !important;
  }
  .nav-tab {
    background: transparent !important;
    border: none !important;
    color: var(--text-muted) !important;
    padding: 12px 24px !important;
    font-size: 14px !important;
    font-weight: 800 !important;
    cursor: pointer !important;
    border-bottom: 3px solid transparent !important;
    border-radius: 8px 8px 0 0 !important;
    transition: all 0.2s ease !important;
  }
  .nav-tab:hover {
    background: rgba(255, 255, 255, 0.05) !important;
    color: var(--text-main) !important;
  }
  .nav-tab.active {
    color: var(--veo-cyan) !important;
    border-bottom: 3px solid var(--veo-cyan) !important;
    background: rgba(0, 229, 255, 0.05) !important;
  }

  /* --- Base structural constraints & COMPACT SCALING (Keep your existing CSS below this) --- */
  .mod-sq-grid { 
    display: grid !important; 
    /* ... rest of your existing style block ... */

  /* --- Base structural constraints & COMPACT SCALING --- */
  .mod-sq-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) !important; gap: 10px !important; justify-content: start !important; }
  .mod-sq-card { max-width: 100% !important; padding: 12px !important; min-height: auto !important; }
  .foc-lanes { display: flex !important; flex-wrap: wrap !important; gap: 10px !important; align-items: flex-start !important; }
  .foc-card { flex: 0 1 230px !important; max-width: 230px !important; padding: 12px !important; }
  .sq-title, .foc-title { font-size: 14px !important; margin-bottom: 2px !important; font-weight: 800 !important; }
  .sq-sub, .foc-sub { font-size: 10px !important; line-height: 1.3 !important; color: var(--text-muted); }
  .sq-footer { margin-top: 8px !important; padding-top: 6px !important; font-size: 10px !important; }
  .cls-panel { overflow-x: auto !important; width: 100% !important; -webkit-overflow-scrolling: touch; }
  .cls-table { min-width: 700px !important; }

  /* --- MOBILE RESPONSIVENESS UPGRADES --- */
  @media (max-width: 768px) {
    .mod-layout { grid-template-columns: 1fr !important; }
    .mod-kpi-row { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)) !important; gap: 8px !important; }
    .top-nav { flex-direction: column !important; height: auto !important; padding: 12px !important; gap: 12px !important; align-items: stretch !important; }
    .nav-tabs { width: 100%; overflow-x: auto; padding-bottom: 4px; justify-content: flex-start; scrollbar-width: none; -ms-overflow-style: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .system-controls { width: 100%; flex-wrap: wrap; justify-content: space-between; gap: 8px !important; }
    .system-controls .control-select, .system-controls .btn { flex: 1 1 45%; text-align: center; min-width: 120px; font-size:11px !important; padding:6px !important; }
    .mod-sq-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; }
    .foc-card { flex: 1 1 100% !important; max-width: 100% !important; }
  }
</style>

<script>
  let globalState = null;

  window.onload = function() {
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.getElementById('theme-selector').value = 'dark';
      const today = new Date().toISOString().split('T')[0];
      const histDate = document.getElementById('hist-date');
      if(histDate) histDate.value = today;
      changeTheme(); changeLayout(); loadPortalData();
    } catch(err) { alert("App Initialization Crash: " + err.message); }
  };

  window.onclick = function(event) {
    if (event.target.classList.contains('modal-overlay')) { event.target.classList.remove('active'); }
  };

  /* --- APP SHELL ROUTING --- */
  function toggleTheme() { const s = document.getElementById('theme-selector'); if(s) { s.value = s.value === 'dark' ? 'light' : 'dark'; changeTheme(); } }
  function changeTheme() { const s = document.getElementById('theme-selector'); if(s) { const t = s.value; if (t === 'light') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); } }
  
  function switchTab(t) { 
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active')); 
    if(event && event.currentTarget) event.currentTarget.classList.add('active'); 
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
    const tabEl = document.getElementById('tab-'+t); 
    if(tabEl) tabEl.classList.add('active'); 
    if(globalState) refreshActiveViews(); 
  }

  function changeLayout() { 
    try {
      ['classic', 'modern', 'focus'].forEach(id => { const el = document.getElementById('layout-' + id); if(el) el.style.display = 'none'; }); 
      const sel = document.getElementById('layout-selector'); let active = sel ? sel.value : 'modern';
      const target = document.getElementById('layout-' + active); if(target) target.style.display = 'block'; 
      if(globalState) refreshActiveViews(); 
    } catch(err) { console.error("Layout Switcher Error: ", err); }
  }

  function loadPortalData() {
    const loader = document.getElementById('global-loader');
    if(loader) loader.style.display='block';
    
    google.script.run
      .withSuccessHandler(function(st) { 
        try {
          globalState = st || { vehicles:[], deployments:[], techs:[], config:{}, incidents:[] }; 
          
          (globalState.vehicles || []).forEach(v => {
            const activeDep = (globalState.deployments || []).find(d => (d.status === 'Dispatched' || d.status === 'Active') && d.rentalId === v.rentalId);
            if (activeDep && v.status !== 'Dispatched' && v.status !== 'Out of Service') {
              v.status = 'Dispatched'; v.zone = activeDep.zone; v.driver = activeDep.coDriver ? (activeDep.tech + ' & ' + activeDep.coDriver) : activeDep.tech;
            } else if (!activeDep && v.status === 'Dispatched') {
              v.status = 'Warehouse (Ready)'; v.zone = '—'; v.driver = '—';
            }
          });

          if(loader) loader.style.display='none'; 
          populateModals(); refreshActiveViews(); 
        } catch(err) {
          if(loader) loader.style.display='none'; alert("FRONTEND CRASH (Data Load): " + err.message);
        }
      })
      .withFailureHandler(function(err) {
        if(loader) loader.style.display='none'; alert("BACKEND CRITICAL LOAD ERROR: " + err.message);
      }).getDashboardState();
  }

  function refreshActiveViews() {
    if(!globalState) return;
    try {
      const l = document.getElementById('layout-selector') ? document.getElementById('layout-selector').value : 'modern';
      if (l === 'focus' && typeof renderFocusOperations === 'function') renderFocusOperations();
      if (l === 'classic' && typeof renderClassicTable === 'function') renderClassicTable();
      if (l === 'modern' && typeof renderModernWidgets === 'function') renderModernWidgets();
      
      if(typeof renderFleetGrid === 'function') renderFleetGrid();
      if(typeof renderTechGrid === 'function') renderTechGrid();
      if(typeof renderShiftMonitor === 'function') renderShiftMonitor();
    } catch(err) { alert("RENDER CRASH: " + err.message); }
  }

  function formatAMPM(tStr) {
    if(!tStr) return 'TBD';
    tStr = String(tStr);
    if(!tStr.includes(':')) return tStr;
    let parts = tStr.split(':'); let hh = parseInt(parts[0], 10); 
    if(isNaN(hh)) return tStr;
    let ampm = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12; if(hh === 0) hh = 12;
    return hh + ':' + (parts[1] || '00') + ' ' + ampm;
  }

  /* --- DYNAMIC SHIFT MONITOR (Live Grid vs Historical) --- */
  function renderShiftMonitor() {
    const container = document.getElementById('shift-monitor-grid'); 
    if(!container) return;
    
    const dateVal = document.getElementById('hist-date') ? document.getElementById('hist-date').value : ''; 
    const shiftVal = document.getElementById('hist-shift') ? document.getElementById('hist-shift').value : '';
    const today = new Date().toISOString().split('T')[0];
    
    let html = '<div class="cls-panel" style="background:var(--bg-panel); border-radius:8px; border:1px solid var(--border-color); padding-bottom:8px;">';
    html += '<table class="cls-table" style="width:100%; border-collapse:collapse; text-align:left;">';
    
    // IF VIEWING TODAY: Show the interactive High-Density Live Grid
    if (dateVal === today) {
        html += '<thead><tr style="border-bottom:2px solid #333; color:var(--text-muted); font-size:10px; text-transform:uppercase;">';
        html += '<th style="padding:16px; width:40px; text-align:center;">Status</th>';
        html += '<th style="padding:16px;">Vehicle / Unit</th>';
        html += '<th style="padding:16px;">Assigned Tech / Team</th>';
        html += '<th style="padding:16px;">Zone(s)</th>';
        html += '<th style="padding:16px;">Focus / Goals</th>';
        html += '<th style="padding:16px;">Time Out</th>';
        html += '<th style="padding:16px; text-align:right;">Quick Actions</th>';
        html += '</tr></thead><tbody>';

        // 1. ACTIVE ROUTES
        let activeDeps = (globalState.deployments || []).filter(d => (d.status === 'Dispatched' || d.status === 'Active') && d.date === today && (shiftVal === '' || d.shift === shiftVal));
        activeDeps.forEach(d => {
          let techProf = (globalState.techs || []).find(t => t.name === d.tech);
          let phoneText = (techProf && techProf.phone) ? '<br><span style="color:var(--veo-cyan); font-size:11px;">📞 ' + techProf.phone + '</span>' : '';
          let coDriverText = d.coDriver ? ' <span style="color:var(--text-muted); font-size:10px;">+ ' + d.coDriver + '</span>' : '';
          
          html += '<tr style="border-bottom:1px solid #2a2a2a;">';
          html += '<td style="padding:16px; text-align:center;"><div style="width:10px; height:10px; border-radius:50%; background:var(--veo-cyan); margin:0 auto; box-shadow:0 0 8px var(--veo-cyan);"></div></td>';
          html += '<td style="padding:16px;"><strong>' + d.vehicle + '</strong><br><span style="color:var(--text-muted); font-size:11px;">Unit: ' + d.rentalId + '</span></td>';
          html += '<td style="padding:16px;"><strong>' + d.tech + '</strong>' + coDriverText + phoneText + '</td>';
          html += '<td style="padding:16px; color:var(--veo-cyan); font-weight:800; font-size:12px;">' + (d.zone || '--') + '</td>';
		let displayGoals = d.goals || '--';
		      // If the backend sent them as separate fields (from a fresh page load), merge them cleanly
		      if (d.focusCategory || d.batteryTarget) {
		          displayGoals = '';
		          if (d.focusCategory) displayGoals += '[' + d.focusCategory + '] ';
		          if (d.batteryTarget) displayGoals += '(Bat: ' + d.batteryTarget + ') ';
		          if (d.goals && d.goals !== '--') displayGoals += d.goals;
		      }
		      
		      html += '<td style="padding:16px; font-size:12px;">' + (displayGoals || '--') + '</td>';

          html += '<td style="padding:16px; font-size:12px;">' + (d.departureTime || '--') + '</td>';
          html += '<td style="padding:16px; text-align:right;">';
          html += '<button class="btn btn-outline" style="padding:4px 8px; font-size:11px; margin-right:4px;" onclick="openEditDispatchModal(\'' + d.id + '\')">Edit</button>';
          html += '<button class="btn btn-dark" style="padding:4px 8px; font-size:11px; margin-right:4px;" onclick="endShift(\'' + d.id + '\', \'' + d.rentalId + '\')">End Shift</button>';
          html += '<button class="btn btn-outline" style="padding:4px 8px; font-size:11px; color:var(--danger); border-color:var(--danger);" onclick="prefillIncidentVan(\'' + d.vehicle + '\')">OOS</button>';
          html += '</td></tr>';
        });

        // 2. WAREHOUSE (READY)
        let readyVans = (globalState.vehicles || []).filter(v => v.status === 'Warehouse (Ready)');
        readyVans.forEach(v => {
          html += '<tr style="border-bottom:1px solid #2a2a2a; opacity:0.8;">';
          html += '<td style="padding:16px; text-align:center;"><div style="width:10px; height:10px; border-radius:50%; background:var(--success); margin:0 auto;"></div></td>';
          html += '<td style="padding:16px;"><strong>' + v.cleanName + '</strong><br><span style="color:var(--text-muted); font-size:11px;">Unit: ' + v.rentalId + '</span></td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; text-align:right;">';
          html += '<button class="btn btn-primary" style="padding:4px 8px; font-size:11px; margin-right:4px;" onclick="prefillDispatchVan(\'' + v.cleanName + '\')">Dispatch</button>';
          html += '<button class="btn btn-outline" style="padding:4px 8px; font-size:11px; color:var(--danger); border-color:var(--danger);" onclick="prefillIncidentVan(\'' + v.cleanName + '\')">Mark OOS</button>';
          html += '</td></tr>';
        });

        // 3. OUT OF SERVICE
        let oosVans = (globalState.vehicles || []).filter(v => v.status === 'Out of Service');
        oosVans.forEach(v => {
          let vInc = (globalState.incidents || []).find(i => i.rentalId === v.rentalId && !i.dateResolved);
          let incText = vInc ? vInc.category : 'Needs Repair';
          let incDate = vInc ? 'Since ' + vInc.dateReported : '--';
          
          html += '<tr style="border-bottom:1px solid #2a2a2a; background:rgba(255,59,48,0.05);">';
          html += '<td style="padding:16px; text-align:center;"><div style="width:10px; height:10px; border-radius:50%; background:var(--danger); margin:0 auto;"></div></td>';
          html += '<td style="padding:16px;"><strong>' + v.cleanName + '</strong><br><span style="color:var(--text-muted); font-size:11px;">Unit: ' + v.rentalId + '</span></td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; color:var(--text-muted);">--</td>';
          html += '<td style="padding:16px; color:var(--danger); font-size:12px; font-weight:700;">' + incText + '</td>';
          html += '<td style="padding:16px; color:var(--text-muted); font-size:12px;">' + incDate + '</td>';
          html += '<td style="padding:16px; text-align:right;">';
          html += '<button class="btn btn-success" style="padding:4px 8px; font-size:11px; margin-right:4px;" onclick="prefillCheckInVan(\'' + v.cleanName + '\')">Check In</button>';
          html += '<button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="openVanActionModal(\'' + v.rentalId + '\')">Details</button>';
          html += '</td></tr>';
        });
        
    } else {
        // IF VIEWING PAST DATE: Show Historical Shift Record Log
        let deps = (globalState.deployments || []).filter(d => d.date === dateVal && d.shift === shiftVal); 
        deps.sort((a, b) => String(a.departureTime || '').localeCompare(String(b.departureTime || '')));

        html += '<thead><tr style="border-bottom:2px solid #333; color:var(--text-muted); font-size:10px; text-transform:uppercase;">';
        html += '<th style="padding:16px;">Van</th>';
        html += '<th style="padding:16px;">Tech(s)</th>';
        html += '<th style="padding:16px;">Zone</th>';
        html += '<th style="padding:16px;">Goals</th>';
        html += '<th style="padding:16px;">Time Out</th>';
        html += '<th style="padding:16px;">Time In</th>';
        html += '<th style="padding:16px;">Status</th>';
        html += '</tr></thead><tbody>';

        if (deps.length === 0) { 
          html += '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-muted); font-weight:600;">No deployment records found for this date and shift.</td></tr>'; 
        } else {
          deps.forEach(d => {
            let techs = d.coDriver ? (d.tech + ' <br><span style="font-size:11px; color:var(--text-muted);">+ ' + d.coDriver + '</span>') : d.tech;
            let sClass = d.status === 'Completed' ? 'color:var(--success); font-weight:700;' : 
                         (['Sick','NCNS','Late'].includes(d.status) ? 'color:var(--danger); font-weight:700;' : 'color:var(--veo-cyan-dark); font-weight:700;');
            
            html += '<tr style="border-bottom:1px solid #2a2a2a;">';
            html += '<td style="padding:16px;"><strong>' + d.vehicle + '</strong><br><span style="font-size:11px; color:var(--text-muted);">' + d.rentalId + '</span></td>';
            html += '<td style="padding:16px;">' + techs + '</td>';
            html += '<td style="padding:16px;"><span class="cls-badge" style="background:rgba(0,229,255,0.1); color:var(--veo-cyan-dark);">' + d.zone + '</span></td>';

		let displayGoals = d.goals || '--';
		      // If the backend sent them as separate fields (from a fresh page load), merge them cleanly
		      if (d.focusCategory || d.batteryTarget) {
		          displayGoals = '';
		          if (d.focusCategory) displayGoals += '[' + d.focusCategory + '] ';
		          if (d.batteryTarget) displayGoals += '(Bat: ' + d.batteryTarget + ') ';
		          if (d.goals && d.goals !== '--') displayGoals += d.goals;
		      }
		      
		      html += '<td style="padding:16px; font-size:12px;">' + (displayGoals || '--') + '</td>';


            html += '<td style="padding:16px;">' + d.departureTime + '</td>';
            html += '<td style="padding:16px;">' + (d.returnTime || '--') + '</td>';
            html += '<td style="padding:16px; ' + sClass + '">' + d.status + '</td></tr>';
          });
        }
    }
    
    html += '</tbody></table></div>';
    container.innerHTML = html;
  }

  /* --- EXISTING TAB RENDERING (Fleet, Tech) --- */
  function renderFleetGrid() {
    const container = document.getElementById('fleet-card-grid'); if(!container) return;
    const searchEl = document.getElementById('fleet-search'); const q = searchEl ? searchEl.value.toLowerCase() : '';
    const layoutEl = document.getElementById('layout-selector'); const layout = layoutEl ? layoutEl.value : 'modern';
    const isFleetTab = document.getElementById('tab-fleet') && document.getElementById('tab-fleet').classList.contains('active');
    
    let vans = (globalState.vehicles || []).filter(v => v.status !== 'Decommissioned' && (!q || (v.cleanName||'').toLowerCase().includes(q) || (v.plate||'').toLowerCase().includes(q)));
    vans.forEach(v => {
      v._driverPhone = '';
      if (v.status === 'Dispatched') {
         const activeDep = (globalState.deployments || []).find(d => d.rentalId === v.rentalId && (d.status === 'Dispatched' || d.status === 'Active'));
         if (activeDep && activeDep.tech) {
            const techProf = (globalState.techs || []).find(t => t.name === activeDep.tech);
            if (techProf && techProf.phone) v._driverPhone = techProf.phone;
         }
      }
    });

    let html = '';
    if (layout === 'classic') {
      html += '<div class="cls-panel"><table class="cls-table"><thead><tr><th>Van</th><th>Unit # / Agency</th><th>Status</th><th>Plate / Service #</th><th>Actions</th></tr></thead><tbody>';
      vans.forEach(v => {
        let bc = v.status === 'Warehouse (Ready)' ? 'color:var(--success); border:1px solid var(--success); background:rgba(52,199,89,0.1);' : (v.status === 'Dispatched' ? 'color:var(--veo-cyan-dark); border:1px solid var(--veo-cyan-dark); background:rgba(0,229,255,0.1);' : 'color:var(--danger); border:1px solid var(--danger); background:rgba(255,59,48,0.1);');
        let phoneHtml = (!isFleetTab && v._driverPhone) ? '<br><span style="font-size:11px; color:var(--veo-cyan);">📞 ' + v._driverPhone + '</span>' : '';
        html += '<tr><td><strong>' + v.cleanName + '</strong>' + phoneHtml + '</td>' +
                '<td>' + v.rentalId + '<br><span style="font-size:10px; color:var(--text-muted);">' + (v.agency || '--') + '</span></td>' +
                '<td><span class="cls-badge" style="' + bc + '">' + (v.status === 'Warehouse (Ready)' ? 'Ready' : v.status) + '</span></td>' +
                '<td>' + v.plate + '<br><span style="font-size:10px; color:var(--text-muted);">Svc: ' + (v.serviceNumber || '--') + '</span></td>' +
                '<td><button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="openVanActionModal(\'' + v.rentalId + '\')">Manage</button></td></tr>';
      });
      html += '</tbody></table></div>';
    } 
    else if (layout === 'focus') {
      html += '<div class="foc-lanes">';
      vans.forEach(v => {
        let bc = v.status === 'Warehouse (Ready)' ? 'var(--success)' : (v.status === 'Dispatched' ? 'var(--veo-cyan)' : 'var(--danger)');
        let phoneHtml = (!isFleetTab && v._driverPhone) ? '<br><span style="color:var(--veo-cyan);">📞 ' + v._driverPhone + '</span>' : '';
        html += '<div class="foc-card" style="border-left-color:' + bc + ';" onclick="openVanActionModal(\'' + v.rentalId + '\')"><div class="foc-card-top"><div><div class="foc-title">' + v.cleanName + '</div>' +
                '<div class="foc-sub">Unit: <strong style="color:var(--text-main);">' + v.rentalId + '</strong> (' + (v.agency || '--') + ') &bull; Plate: ' + v.plate + ' &bull; Svc: ' + (v.serviceNumber || '--') + phoneHtml + '</div></div></div>' +
                '<div style="font-weight:800; color:' + bc + '; font-size:11px; margin-top:8px;">' + (v.status === 'Warehouse (Ready)' ? 'READY' : v.status.toUpperCase()) + '</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="mod-sq-grid">';
      vans.forEach(v => {
        let bClass = v.status === 'Warehouse (Ready)' ? 'st-ready' : (v.status === 'Dispatched' ? 'st-active' : 'st-oos');
        let color = v.status === 'Warehouse (Ready)' ? 'var(--success)' : (v.status === 'Dispatched' ? 'var(--veo-cyan-dark)' : 'var(--danger)');
        let phoneHtml = (!isFleetTab && v._driverPhone) ? '<br><span style="color:var(--veo-cyan);">📞 ' + v._driverPhone + '</span>' : '';
        html += '<div class="mod-sq-card ' + bClass + '" onclick="openVanActionModal(\'' + v.rentalId + '\')"><div><div class="sq-title">' + v.cleanName + '</div>' +
                '<div class="sq-sub">Unit: <strong style="color:var(--text-main);">' + v.rentalId + '</strong> (' + (v.agency || '--') + ')<br>Plate: ' + v.plate + '<br>Svc: ' + (v.serviceNumber || '--') + phoneHtml + '</div></div>' +
                '<div class="sq-footer" style="color:' + color + ';">' + (v.status === 'Warehouse (Ready)' ? 'READY' : v.status.toUpperCase()) + '</div></div>';
      });
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function renderTechGrid() {
    const container = document.getElementById('tech-card-grid'); if(!container) return;
    const layout = document.getElementById('layout-selector') ? document.getElementById('layout-selector').value : 'modern';
    const q = document.getElementById('tech-search') ? document.getElementById('tech-search').value.toLowerCase() : '';
    const sortBy = document.getElementById('tech-sort') ? document.getElementById('tech-sort').value : 'smart';
    const filterShift = document.getElementById('tech-filter-shift') ? document.getElementById('tech-filter-shift').value : '';
    const filterTime = document.getElementById('tech-filter-time') ? document.getElementById('tech-filter-time').value : '';
    
    let techs = [...(globalState.techs || [])].filter(t => t.hrStatus !== 'Terminated');
    const now = new Date(); const currentDay = ['sun','mon','tue','wed','thu','fri','sat'][now.getDay()];
    const currentHour = now.getHours() + (now.getMinutes() / 60);

    techs.forEach(t => {
      const dep = (globalState.deployments || []).find(d => d.status === 'Dispatched' && (d.tech === t.name || d.coDriver === t.name));

      if (match) {
         const dayNames = ['mon','tue','wed','thu','fri','sat','sun'];
         let i1 = dayNames.findIndex(d => match[1].includes(d)); let i2 = dayNames.findIndex(d => match[2].includes(d));
         if(i1 > -1 && i2 > -1) {
            if(i1 <= i2) { for(let i=i1; i<=i2; i++) wDays.push(dayNames[i]); }
            else { for(let i=i1; i<7; i++) wDays.push(dayNames[i]); for(let i=0; i<=i2; i++) wDays.push(dayNames[i]); }
         }
      } else {

      }

  function buildTechTimelineGraphic(workDaysStr, startStr, endStr) {
    let s = 0, e = 0;
    if (startStr && endStr && String(startStr).includes(':') && String(endStr).includes(':')) { let [h1,m1] = String(startStr).split(':'); s = ((parseInt(h1)||0) + (parseInt(m1)||0)/60) / 24 * 100; let [h2,m2] = String(endStr).split(':'); e = ((parseInt(h2)||0) + (parseInt(m2)||0)/60) / 24 * 100; }
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; const str = String(workDaysStr||'').toLowerCase(); let wDays = [];
    const match = str.match(/(mon|tue|wed|thu|fri|sat|sun)\s*-\s*(mon|tue|wed|thu|fri|sat|sun)/);
    if (match) {
       const dayNames = ['mon','tue','wed','thu','fri','sat','sun']; let i1 = dayNames.findIndex(d => match[1].includes(d)); let i2 = dayNames.findIndex(d => match[2].includes(d));
       if(i1 > -1 && i2 > -1) { if(i1 <= i2) { for(let i=i1; i<=i2; i++) wDays.push(dayNames[i]); } else { for(let i=i1; i<7; i++) wDays.push(dayNames[i]); for(let i=0; i<=i2; i++) wDays.push(dayNames[i]); } }
    } else { days.forEach(d => { if(str.includes(d.toLowerCase())) wDays.push(d.toLowerCase()); }); if(wDays.length===0 && str) wDays = days; }
    
    let html = '<div style="display:flex; flex-direction:column; gap:6px; font-size:10px; font-weight:700; background:var(--bg-panel); padding:16px; border-radius:8px; border:1px solid var(--border-color);"><div style="margin-bottom:4px; color:var(--text-muted); text-transform:uppercase; font-size:11px; display:flex; justify-content:space-between;"><span>Weekly Schedule</span> <span>00:00 - 24:00</span></div>';
    days.forEach(d => {
       let isWorking = wDays.includes(d.toLowerCase()); let barHtml = '';
       if (isWorking && startStr && endStr) { if (e >= s) { barHtml = '<div style="position:absolute; left:' + s + '%; width:' + (e-s) + '%; top:0; bottom:0; background:var(--veo-cyan); border-radius:4px; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div>'; } else { barHtml = '<div style="position:absolute; left:' + s + '%; width:' + (100-s) + '%; top:0; bottom:0; background:var(--veo-cyan); border-radius:4px 0 0 4px; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div><div style="position:absolute; left:0; width:' + e + '%; top:0; bottom:0; background:var(--veo-cyan); border-radius:0 4px 4px 0; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div>'; } }
       html += '<div style="display:flex; align-items:center; gap:8px;"><div style="width:25px; color:' + (isWorking ? 'var(--text-main)' : 'var(--text-muted)') + '; opacity:' + (isWorking?1:0.4) + ';">' + d + '</div><div style="flex:1; height:12px; background:rgba(0,0,0,0.05); border-radius:4px; position:relative; border:1px solid var(--border-color); overflow:hidden;">' + barHtml + '<div style="position:absolute; left:25%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div><div style="position:absolute; left:50%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div><div style="position:absolute; left:75%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div></div></div>';
    });
    html += '<div style="display:flex; justify-content:space-between; margin-left:33px; color:var(--text-muted); font-size:9px; margin-top:2px; padding:0 2px;"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div></div>';
    return html;
  }

    const leadTechProfile = (globalState.techs || []).find(t => t.name === assignedTech);

    const activeDeps = (globalState.deployments || []).filter(d => d.status === 'Dispatched');
    let conflicts = [], warnings = [];
    activeDeps.forEach(d => { let isC = false, rsn = []; if (d.rentalId === rentalId) { isC = true; rsn.push('Van ' + cleanName + ' is assigned to ' + d.tech); } if (d.tech === assignedTech || (d.coDriver && d.coDriver === assignedTech)) { isC = true; rsn.push(assignedTech + ' is driving ' + d.vehicle); } if (coDriver && (d.tech === coDriver || (d.coDriver && d.coDriver === coDriver))) { isC = true; rsn.push(coDriver + ' is driving ' + d.vehicle); } if (isC) { conflicts.push(d); warnings.push("⚠️ " + rsn.join(" AND ")); } });
    warnings = [...new Set(warnings)];
    if (warnings.length > 0) { if (!confirm("CONFLICTS DETECTED:\n\n" + warnings.join("\n") + "\n\nEnd active shifts and re-deploy?")) return; }
    const p = { cleanName: cleanName, rentalId: rentalId, assignedTech: assignedTech, coDriver: coDriver, isTraining: document.getElementById('dp_training').checked, shift: document.getElementById('dp_shift').value, workZone: selectedZones, batteryTarget: document.getElementById('dp_target').value, focusCategory: document.getElementById('dp_focus').value, goals: document.getElementById('dp_goals').value };
    closeModal('dispatchModal');
    const now = new Date(); const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    conflicts.forEach(c => { c.status = 'Completed'; c.returnTime = timeString; if (c.rentalId !== rentalId) { const oldV = (globalState.vehicles || []).find(v => v.rentalId === c.rentalId); if (oldV) { oldV.status = 'Warehouse (Ready)'; oldV.zone = '—'; oldV.driver = '—'; } } });
    
// Format the Focus / Goals / Battery into a clean string for the frontend cache
    let combinedGoals = '';
    if (p.focusCategory) combinedGoals += '[' + p.focusCategory + '] ';
    if (p.batteryTarget) combinedGoals += '(Bat: ' + p.batteryTarget + ') ';
    if (p.goals) combinedGoals += p.goals;
    if (combinedGoals.trim() === '') combinedGoals = '--';

    globalState.deployments.unshift({ 
      id:'...', 
      date: now.toISOString().split('T')[0], 
      shift: p.shift, 
      vehicle: p.cleanName, 
      rentalId: p.rentalId, 
      tech: p.assignedTech, 
      zone: p.workZone, 
      status: 'Dispatched', 
      departureTime: timeString, 
      coDriver: p.coDriver, 
      isTraining: p.isTraining,
      goals: combinedGoals.trim() // <--- NEW: Injects the combined string
    });


    const vIdx = (globalState.vehicles || []).findIndex(v=>v.rentalId===p.rentalId); if(vIdx > -1) { globalState.vehicles[vIdx].status = 'Dispatched'; globalState.vehicles[vIdx].zone = p.workZone; globalState.vehicles[vIdx].driver = p.coDriver ? (p.assignedTech + ' & ' + p.coDriver) : p.assignedTech; }
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).processDispatchCheckout(p);
  }

  function submitEditDispatch(e) {
    e.preventDefault();
    const zoneSelect = document.getElementById('ed_zone');
    const selectedZones = Array.from(zoneSelect.selectedOptions).map(option => option.value).join(', ');
    const p = { id: document.getElementById('ed_id').value, zone: selectedZones, target: document.getElementById('ed_target').value, goals: document.getElementById('ed_goals').value };
    closeModal('editDispatchModal');
    const dIdx = (globalState.deployments || []).findIndex(d=>d.id===p.id); if(dIdx > -1) { globalState.deployments[dIdx].zone = p.zone; globalState.deployments[dIdx].target = p.target; globalState.deployments[dIdx].goals = p.goals; }
    refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).updateDeploymentRecord(p);
  }

  function endShift(depId, rentId) {
    if(!confirm("End shift?")) return;
    const dIdx = (globalState.deployments || []).findIndex(d=>d.id===depId); if(dIdx > -1) { globalState.deployments[dIdx].status = 'Completed'; globalState.deployments[dIdx].returnTime = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    const vIdx = (globalState.vehicles || []).findIndex(v=>v.rentalId===rentId); if(vIdx > -1) { globalState.vehicles[vIdx].status = 'Warehouse (Ready)'; globalState.vehicles[vIdx].driver = '—'; globalState.vehicles[vIdx].zone = '—'; }
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).endShift(depId, rentId);
  }

  function triggerCsvExport() { const dateVal = document.getElementById('hist-date').value; const shiftSelect = document.getElementById('hist-shift'); const shiftName = shiftSelect && shiftSelect.value ? shiftSelect.value : 'First Shift'; google.script.run.withSuccessHandler(function(res) { if (!res.success) { alert(res.message); return; } const blob = new Blob([res.csvContent], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.setAttribute('download', res.filename); document.body.appendChild(link); link.click(); document.body.removeChild(link); }).withFailureHandler(function(err) { alert('Export failed: ' + err.message); }).exportShiftManifestCsv(dateVal, shiftName); }
  function triggerPdfPrint() { const dateVal = document.getElementById('hist-date').value; const shiftSelect = document.getElementById('hist-shift'); const shiftName = shiftSelect && shiftSelect.value ? shiftSelect.value : 'First Shift'; google.script.run.withSuccessHandler(function(htmlString) { const printWindow = window.open('', '_blank'); printWindow.document.open(); printWindow.document.write(htmlString); printWindow.document.close(); }).withFailureHandler(function(err) { alert('Failed to generate PDF: ' + err.message); }).getPrintableShiftManifestHtml(dateVal, shiftName); }
  function submitAttendance(e) { e.preventDefault(); const p = { techName: document.getElementById('att_tech').value, date: document.getElementById('att_date').value, type: document.getElementById('att_type').value, notes: document.getElementById('att_notes').value }; closeModal('attendanceModal'); const tIdx = (globalState.techs || []).findIndex(t => t.name === p.techName); if(tIdx > -1) globalState.techs[tIdx].status = p.type; refreshActiveViews(); const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block'; google.script.run.withSuccessHandler(()=>loadPortalData()).logTechAttendance(p); }
  function clearTechException(techName, isLate) { if(!confirm('Are you sure you want to clear the exception for ' + techName + ' and return them to Available?')) return; const tIdx = (globalState.techs || []).findIndex(t => t.name === techName); if(tIdx > -1) globalState.techs[tIdx].status = 'Available'; refreshActiveViews(); const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block'; google.script.run.withSuccessHandler(()=>loadPortalData()).clearTechException({ techName: techName, isLate: isLate }); }
</script>
