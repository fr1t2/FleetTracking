<script>
  let globalState = null;

  window.onload = function() {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.getElementById('theme-selector').value = 'dark';
    const today = new Date().toISOString().split('T')[0];
    if(document.getElementById('hist-date')) document.getElementById('hist-date').value = today;
    changeTheme(); changeLayout(); loadPortalData();
  };

  window.onclick = function(event) {
    if (event.target.classList.contains('modal-overlay')) { event.target.classList.remove('active'); }
  };

  /* --- APP SHELL ROUTING --- */
  function toggleTheme() {
    const s = document.getElementById('theme-selector');
    if(s) { s.value = s.value === 'dark' ? 'light' : 'dark'; changeTheme(); }
  }

  function changeTheme() { 
    const s = document.getElementById('theme-selector'); 
    if(s) { 
      const t = s.value; 
      if (t === 'light') document.documentElement.removeAttribute('data-theme'); 
      else document.documentElement.setAttribute('data-theme', t); 
    } 
  }

  function switchTab(t) { 
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active')); 
    if(event && event.currentTarget) event.currentTarget.classList.add('active'); 
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
    const tabEl = document.getElementById('tab-'+t); 
    if(tabEl) tabEl.classList.add('active'); 
    if(globalState) refreshActiveViews(); 
  }

  function changeLayout() { 
    ['classic', 'modern', 'focus'].forEach(id => { 
      const el = document.getElementById('layout-' + id); 
      if(el) el.style.display = 'none'; 
    }); 
    const sel = document.getElementById('layout-selector'); 
    if(sel) { 
      const target = document.getElementById(`layout-${sel.value}`); 
      if(target) target.style.display = 'block'; 
    } 
    if(globalState) refreshActiveViews(); 
  }

  function loadPortalData() {
    const loader = document.getElementById('global-loader');
    if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(function(st) { 
      globalState = st; 
      
      // AUTO-HEALER
      globalState.vehicles.forEach(v => {
        const activeDep = globalState.deployments.find(d => (d.status === 'Dispatched' || d.status === 'Active') && d.rentalId === v.rentalId);
        if (activeDep && v.status !== 'Dispatched' && v.status !== 'Out of Service') {
          v.status = 'Dispatched'; v.zone = activeDep.zone; v.driver = activeDep.coDriver ? `${activeDep.tech} & ${activeDep.coDriver}` : activeDep.tech;
        } else if (!activeDep && v.status === 'Dispatched') {
          v.status = 'Warehouse (Ready)'; v.zone = '—'; v.driver = '—';
        }
      });

      if(loader) loader.style.display='none'; 
      populateModals(); 
      refreshActiveViews(); 
    }).getDashboardState();
  }

  function refreshActiveViews() {
    if(!globalState) return;
    const l = document.getElementById('layout-selector') ? document.getElementById('layout-selector').value : 'modern';
    if (l === 'focus' && typeof renderFocusOperations === 'function') renderFocusOperations();
    if (l === 'classic' && typeof renderClassicTable === 'function') renderClassicTable();
    if (l === 'modern' && typeof renderModernWidgets === 'function') renderModernWidgets();
    if(typeof renderFleetGrid === 'function') renderFleetGrid();
    if(typeof renderTechGrid === 'function') renderTechGrid();
    if(typeof renderHistoryTab === 'function') renderHistoryTab();
  }

  /* --- SECONDARY TABS RENDERING --- */
  function formatAMPM(tStr) {
    if(!tStr) return 'TBD';
    let [h, m] = tStr.split(':'); if(!h) return tStr;
    let hh = parseInt(h, 10); let ampm = hh >= 12 ? 'PM' : 'AM';
    hh = hh % 12; if(hh === 0) hh = 12;
    return `${hh}:${m||'00'} ${ampm}`;
  }

  function renderFleetGrid() {
    const container = document.getElementById('fleet-card-grid'); if(!container) return;
    const q = document.getElementById('fleet-search') ? document.getElementById('fleet-search').value.toLowerCase() : '';
    const layout = document.getElementById('layout-selector') ? document.getElementById('layout-selector').value : 'modern';
    let vans = globalState.vehicles.filter(v => v.status !== 'Decommissioned' && (!q || v.cleanName.toLowerCase().includes(q) || v.plate.toLowerCase().includes(q)));
    let html = '';

    if (layout === 'classic') {
      html += `<div class="cls-panel"><table class="cls-table"><thead><tr><th>Van</th><th>Unit #</th><th>Status</th><th>Plate</th><th>Actions</th></tr></thead><tbody>`;
      vans.forEach(v => {
        let bc = v.status === 'Warehouse (Ready)' ? 'color:var(--success); border:1px solid var(--success); background:rgba(52,199,89,0.1);' : (v.status === 'Dispatched' ? 'color:var(--veo-cyan-dark); border:1px solid var(--veo-cyan-dark); background:rgba(0,229,255,0.1);' : 'color:var(--danger); border:1px solid var(--danger); background:rgba(255,59,48,0.1);');
        html += `<tr><td><strong>${v.cleanName}</strong></td><td>${v.rentalId}</td><td><span class="cls-badge" style="${bc}">${v.status === 'Warehouse (Ready)' ? 'Ready' : v.status}</span></td><td>${v.plate}</td><td><button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="openVanActionModal('${v.rentalId}')">Manage</button></td></tr>`;
      });
      html += `</tbody></table></div>`;
    } 
    else if (layout === 'focus') {
      html += `<div class="foc-lanes" style="flex-wrap:wrap; align-items:flex-start;">`;
      vans.forEach(v => {
        let bc = v.status === 'Warehouse (Ready)' ? 'var(--success)' : (v.status === 'Dispatched' ? 'var(--veo-cyan)' : 'var(--danger)');
        html += `<div class="foc-card" style="border-left-color:${bc}; width:280px; margin-bottom:8px; cursor:pointer;" onclick="openVanActionModal('${v.rentalId}')"><div class="foc-card-top"><div><div class="foc-title">${v.cleanName}</div><div class="foc-sub">${v.rentalId} &bull; Plate: ${v.plate}</div></div></div><div style="font-weight:800; color:${bc}; font-size:11px; margin-top:8px;">${v.status === 'Warehouse (Ready)' ? 'READY' : v.status.toUpperCase()}</div></div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="mod-sq-grid">`;
      vans.forEach(v => {
        let bClass = v.status === 'Warehouse (Ready)' ? 'st-ready' : (v.status === 'Dispatched' ? 'st-active' : 'st-oos');
        let color = v.status === 'Warehouse (Ready)' ? 'var(--success)' : (v.status === 'Dispatched' ? 'var(--veo-cyan-dark)' : 'var(--danger)');
        html += `<div class="mod-sq-card ${bClass}" onclick="openVanActionModal('${v.rentalId}')"><div><div class="sq-title">${v.cleanName}</div><div class="sq-sub">${v.rentalId}<br>${v.plate}</div></div><div class="sq-footer" style="color:${color};">${v.status === 'Warehouse (Ready)' ? 'READY' : v.status.toUpperCase()}</div></div>`;
      });
      html += `</div>`;
    }
    container.innerHTML = html;
  }

  function renderTechGrid() {
    const container = document.getElementById('tech-card-grid'); if(!container) return;
    const layout = document.getElementById('layout-selector') ? document.getElementById('layout-selector').value : 'modern';
    
    // 1. Pull values from advanced filter bars
    const q = document.getElementById('tech-search') ? document.getElementById('tech-search').value.toLowerCase() : '';
    const sortBy = document.getElementById('tech-sort') ? document.getElementById('tech-sort').value : 'smart';
    const filterShift = document.getElementById('tech-filter-shift') ? document.getElementById('tech-filter-shift').value : '';
    const filterTime = document.getElementById('tech-filter-time') ? document.getElementById('tech-filter-time').value : '';
    
    // Strip terminated
    let techs = [...(globalState.techs || [])].filter(t => t.hrStatus !== 'Terminated');
    
    // TIME MATH ENGINE
    const now = new Date();
    const currentDay = ['sun','mon','tue','wed','thu','fri','sat'][now.getDay()];
    const currentHour = now.getHours() + (now.getMinutes() / 60);

    techs.forEach(t => {
      const dep = globalState.deployments.find(d => d.status === 'Dispatched' && (d.tech === t.name || d.coDriver === t.name));
      t._isDispatched = !!dep;
      if(dep) t._displayStatus = `🚙 Route: ${dep.vehicle}`; else t._displayStatus = t.status; 
      
      const str = (t.workDays || '').toLowerCase();
      let wDays = [];
      const match = str.match(/(mon|tue|wed|thu|fri|sat|sun)\s*-\s*(mon|tue|wed|thu|fri|sat|sun)/);
      if (match) {
         const dayNames = ['mon','tue','wed','thu','fri','sat','sun'];
         let i1 = dayNames.findIndex(d => match[1].includes(d)); let i2 = dayNames.findIndex(d => match[2].includes(d));
         if(i1 > -1 && i2 > -1) {
            if(i1 <= i2) { for(let i=i1; i<=i2; i++) wDays.push(dayNames[i]); }
            else { for(let i=i1; i<7; i++) wDays.push(dayNames[i]); for(let i=0; i<=i2; i++) wDays.push(dayNames[i]); }
         }
      } else {
         ['mon','tue','wed','thu','fri','sat','sun'].forEach(d => { if(str.includes(d)) wDays.push(d); });
         if(wDays.length===0 && str) wDays = ['mon','tue','wed','thu','fri','sat','sun'];
      }
      
      t._isWorkingToday = wDays.includes(currentDay);
      t._isShiftActive = false;
      if (t._isWorkingToday && t.startTime) {
         let [h, m] = t.startTime.split(':');
         let startH = parseInt(h) + (parseInt(m)||0)/60;
         let startWindow = startH - 0.5; 
         let endWindow = startH + 8;     
         if (endWindow > 24) { t._isShiftActive = (currentHour >= startWindow) || (currentHour <= (endWindow - 24)); } 
         else { t._isShiftActive = (currentHour >= startWindow && currentHour <= endWindow); }
      }
    });

    // 2. Apply Multi-Layer Filters
    if (q) techs = techs.filter(t => t.name.toLowerCase().includes(q) || (t.shift||'').toLowerCase().includes(q));
    if (filterShift) techs = techs.filter(t => t.shift === filterShift);
    if (filterTime) {
      const [startRange, endRange] = filterTime.split('-').map(v => parseInt(v.replace(':','')));
      techs = techs.filter(t => {
        if (!t.startTime) return false;
        const techT = parseInt(t.startTime.replace(':',''));
        return techT >= startRange && techT <= endRange;
      });
    }

    let html = '';
    const layoutClass = layout === 'focus' ? 'foc-lanes' : (layout === 'classic' ? 'cls-table' : 'mod-sq-grid');
    const layoutStyle = layout === 'focus' ? 'flex-wrap:wrap; align-items:flex-start;' : '';

    // 3. Apply Sort Mode Routing
    if (sortBy === 'smart') {
      let deployedTechs = techs.filter(t => t._isDispatched);
      let rosterTechs = techs.filter(t => !t._isDispatched);
      rosterTechs.sort((a,b) => {
        const w = t => {
          if(['Sick','NCNS','Late','PTO'].includes(t.status) || !t.passedTest || t.restricted) return 1;
          if(t._isWorkingToday && t._isShiftActive) return 2;
          if(t._isWorkingToday && !t._isShiftActive) return 3;
          return 4;
        };
        return w(a) - w(b) || a.name.localeCompare(b.name);
      });

      if (deployedTechs.length > 0) {
        html += `<div style="margin-bottom: 32px;"><h3 style="font-weight:900; color:var(--veo-cyan); margin-bottom:12px; border-bottom:2px solid var(--veo-cyan); padding-bottom:8px;">🚙 ACTIVE ON ROUTE</h3><div class="${layoutClass}" style="${layoutStyle}">`;
        deployedTechs.forEach(t => { html += buildTechCardHTML(t, layout); });
        html += `</div></div>`;
      }
      if (rosterTechs.length > 0) {
        html += `<div><h3 style="font-weight:900; color:var(--text-muted); margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">👥 WAREHOUSE ROSTER</h3><div class="${layoutClass}" style="${layoutStyle}">`;
        rosterTechs.forEach(t => { html += buildTechCardHTML(t, layout); });
        html += `</div></div>`;
      }
    } else {
      // Linear Sorting logic (combines active and roster together)
      if (sortBy === 'alpha') {
        techs.sort((a,b) => a.name.localeCompare(b.name));
      } else if (sortBy === 'shift_time') {
        techs.sort((a,b) => {
          let s = (a.shift||'').localeCompare(b.shift||'');
          if (s !== 0) return s;
          let t1 = a.startTime||'99:99'; let t2 = b.startTime||'99:99';
          if (t1 !== t2) return t1.localeCompare(t2);
          return a.name.localeCompare(b.name);
        });
      }

      if (sortBy === 'shift_time' && layout !== 'classic') {
        let currentShift = '';
        html += `<div style="display:flex; flex-direction:column; gap:32px;">`;
        techs.forEach(t => {
          if (t.shift !== currentShift) {
            if(currentShift !== '') html += `</div></div>`;
            currentShift = t.shift;
            html += `<div><h3 style="margin-bottom:16px; font-size:16px; font-weight:900; color:var(--veo-cyan-dark); border-bottom:1px solid var(--border-color); padding-bottom:8px;">${currentShift}</h3><div class="${layoutClass}" style="${layoutStyle}">`;
          }
          html += buildTechCardHTML(t, layout);
        });
        if(techs.length > 0) html += `</div></div></div>`;
      } else {
        html += `<div class="${layoutClass}" style="${layoutStyle}">`;
        techs.forEach(t => { html += buildTechCardHTML(t, layout); });
        html += `</div>`;
      }
    }
    
    container.innerHTML = html;
  }

  function buildTechCardHTML(t, layout) {
    let styleMod = '';
    if (!t._isDispatched) {
      if (!t._isWorkingToday) styleMod = 'opacity:0.3; filter:grayscale(1);'; 
      else if (!t._isShiftActive) styleMod = 'opacity:0.65;'; 
    }
    if (['Sick','NCNS','Late','PTO'].includes(t.status)) styleMod = 'opacity:1;'; 

    let badges = '';
    if (t.restricted) badges += `<div style="background:var(--danger); color:#fff; font-size:9px; font-weight:900; text-align:center; border-radius:4px; padding:2px; margin-bottom:4px;">🛑 MVR RESTRICTED</div>`;
    if (!t.passedTest) badges += `<div style="background:#ff9500; color:#fff; font-size:9px; font-weight:900; text-align:center; border-radius:4px; padding:2px; margin-bottom:4px;">⚠️ NO DRIVING TEST</div>`;

    let color = 'var(--success)';
    if (t._isDispatched) color = 'var(--veo-cyan)';
    else if (['Sick','NCNS','Late'].includes(t.status) || t.restricted) color = 'var(--danger)';
    else if (t.status === 'PTO') color = '#007aff';
    else if (!t.passedTest) color = '#ff9500';
    else if (!t._isWorkingToday) color = 'var(--text-muted)'; 

    if (layout === 'focus') {
      return `<div class="foc-card" style="border-left-color:${color}; width:280px; margin-bottom:8px; cursor:pointer; ${styleMod}" onclick="openTechActionModal('${t.name}')">
        ${badges}
        <div class="foc-card-top"><div><div class="foc-title">${t.name} ${t.goFast?'⚡':''} ${t.trainer?'🎓':''}</div><div class="foc-sub">${t.workDays} | ${formatAMPM(t.startTime)} - ${formatAMPM(t.endTime)}</div></div></div>
        <div style="font-weight:700; color:${color}; font-size:12px; margin-top:8px;">${t._displayStatus.toUpperCase()}</div>
      </div>`;
    } else {
      let splitName = t.name.split(' ');
      return `<div class="mod-sq-card" style="border-top-color:${color}; ${styleMod}" onclick="openTechActionModal('${t.name}')">
        <div>${badges}<div class="sq-title">${splitName[0]} ${t.goFast?'⚡':''} ${t.trainer?'🎓':''}</div><div class="sq-sub">${t.workDays}<br>${formatAMPM(t.startTime)} - ${formatAMPM(t.endTime)}</div></div>
        <div class="sq-footer" style="color:${color};">${t._displayStatus.toUpperCase()}</div>
      </div>`;
    }
  }

  function renderHistoryTab() {
    const container = document.getElementById('history-table-body'); if(!container) return;
    const dateVal = document.getElementById('hist-date') ? document.getElementById('hist-date').value : '';
    const shiftVal = document.getElementById('hist-shift') ? document.getElementById('hist-shift').value : '';
    let deps = globalState.deployments.filter(d => d.date === dateVal && d.shift === shiftVal);
    deps.sort((a, b) => (a.departureTime || '').localeCompare(b.departureTime || ''));
    let html = '';

    if (deps.length === 0) { html = '<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:600; width:100%;">No deployment records found.</div>'; } 
    else {
      html += `<div class="cls-panel"><table class="cls-table"><thead><tr><th>Van</th><th>Tech(s)</th><th>Zone</th><th>Goals</th><th>Time Out</th><th>Time In</th><th>Status</th></tr></thead><tbody>`;
      deps.forEach(d => {
        let techs = d.coDriver ? `${d.tech} <br><span style="font-size:11px; color:var(--text-muted);">+ ${d.coDriver}</span>` : d.tech;
        let sClass = d.status === 'Completed' ? 'color:var(--success); font-weight:700;' : (['Sick','NCNS','Late'].includes(d.status) ? 'color:var(--danger); font-weight:700;' : 'color:var(--veo-cyan-dark); font-weight:700;');
        html += `<tr><td><strong>${d.vehicle}</strong><br><span style="font-size:11px; color:var(--text-muted);">${d.rentalId}</span></td><td>${techs}</td><td><span class="cls-badge" style="background:rgba(0,229,255,0.1); color:var(--veo-cyan-dark);">${d.zone}</span></td><td style="max-width:200px; white-space:normal;">${d.goals || '--'}</td><td>${d.departureTime}</td><td>${d.returnTime || '--'}</td><td style="${sClass}">${d.status}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    container.innerHTML = html;
  }

  /* --- MODAL CONTROLLERS --- */
  function openModal(id) { const m = document.getElementById(id); if(m) m.classList.add('active'); }
  function closeModal(id) { const m = document.getElementById(id); if(m) m.classList.remove('active'); }

  function prefillDispatchVan(cleanName) { const sel = document.getElementById('dp_van'); if(sel) sel.value = cleanName.trim(); openModal('dispatchModal'); }
  function prefillDispatchTech(techName, isTraining=false) { 
    const sel = document.getElementById('dp_tech'); if(sel) sel.value = techName.trim(); 
    const trCheck = document.getElementById('dp_training'); if(trCheck) trCheck.checked = isTraining;
    openModal('dispatchModal'); 
  }
  function prefillIncidentVan(cleanName) { const sel = document.getElementById('inc_van'); if(sel) { sel.value = cleanName.trim(); if (sel.selectedIndex <= 0) { for(let i = 0; i < sel.options.length; i++) { if(sel.options[i].text.includes(cleanName.trim())) { sel.selectedIndex = i; break; } } } } const oosCb = document.getElementById('inc_oos'); if(oosCb) oosCb.checked = true; openModal('incidentModal'); }
  function prefillDecomVan(cleanName) { const sel = document.getElementById('dec_van'); if(sel) sel.value = cleanName.trim(); openModal('decomModal'); }
  function prefillCheckInVan(cleanName) { const sel = document.getElementById('ci_van'); if(sel) { sel.value = cleanName.trim(); if (sel.selectedIndex <= 0) { for(let i = 0; i < sel.options.length; i++) { if(sel.options[i].text.includes(cleanName.trim())) { sel.selectedIndex = i; break; } } } } openModal('checkInModal'); }

  function openVanActionModal(rentalId) {
    const v = globalState.vehicles.find(x => x.rentalId === rentalId); if(!v) return;
    const title = document.getElementById('va_title'); if(title) title.innerText = `${v.cleanName} Profile`;
    const vanDeps = (globalState.deployments || []).filter(d => d.rentalId === rentalId);
    const pastDeps = vanDeps.filter(d => d.status === 'Completed');
    const lastDep = pastDeps.length > 0 ? pastDeps[0] : null; 
    const lastDriver = lastDep ? lastDep.tech : 'None';
    const lastZone = lastDep ? lastDep.zone : 'None';
    const vIncidents = (globalState.incidents || []).filter(i => i.rentalId === rentalId);
    
    let coastEnabled = 'Yes'; if(v.addons) coastEnabled = v.addons.toLowerCase().includes('no coast') ? 'No' : 'Yes';
    
    let displayPlate = v.plate;
    let plateMatch = v.plate.match(/^([a-zA-Z]{2})\s*-\s*(.+)$/);
    if (plateMatch) { displayPlate = `<span style="opacity:0.6; font-size:10px;">${plateMatch[1].toUpperCase()}</span> <span style="font-weight:900;">${plateMatch[2]}</span>`; }

    let samsaraHtml = 'N/A';
    if(v.samsaraSerial || v.samsaraLink) {
        let link = v.samsaraLink || `https://cloud.samsara.com/fleet/vehicles?q=${v.samsaraSerial}`;
        let displaySerial = v.samsaraSerial || 'View Samsara';
        samsaraHtml = `<a href="${link}" target="_blank" style="color:var(--veo-cyan); text-decoration:none;">${displaySerial} ↗</a>`;
    }
    
    const isFleetTab = document.getElementById('tab-fleet') && document.getElementById('tab-fleet').classList.contains('active');

    let html = `<div style="display:flex; flex-direction:column; gap:16px;">`;
    let bannerColor = v.status === 'Warehouse (Ready)' ? 'var(--success)' : (v.status === 'Dispatched' ? 'var(--veo-cyan-dark)' : 'var(--danger)');
    html += `<div style="background:rgba(255,255,255,0.02); border-left: 4px solid ${bannerColor}; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color);">
      <div style="font-size:18px; font-weight:900;">${v.status === 'Warehouse (Ready)' ? 'READY' : v.status.toUpperCase()}</div>
      <div style="color:var(--text-muted); font-size:12px; margin-top:4px;">${v.makeModel} &bull; Plate: ${displayPlate}</div>
    </div>`; 
    
    html += `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
      <div style="background:var(--bg-panel); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Lifetime Shifts</div><div style="font-weight:900; font-size:16px; margin-top:4px; color:var(--veo-cyan);">${vanDeps.length}</div>
      </div>
      <div style="background:var(--bg-panel); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Last Driver</div><div style="font-weight:800; font-size:14px; margin-top:4px;">${lastDriver}</div>
      </div>
      <div style="background:var(--bg-panel); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Samsara GPS</div>
        <div style="font-weight:800; font-size:14px; margin-top:4px;">${samsaraHtml}</div>
      </div>
      <div style="background:var(--bg-panel); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Coast Card</div><div style="font-weight:800; font-size:14px; margin-top:4px; color:${coastEnabled==='Yes'?'var(--success)':'var(--text-muted)'}">${coastEnabled}</div>
      </div>
    </div>`;
    
    html += `<h4 style="font-size:12px; color:var(--text-muted); text-transform:uppercase; margin-top:8px;">Dispatch Operations</h4>`;
    html += `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">`;
    if (v.status === 'Warehouse (Ready)') {

  function buildTechTimelineGraphic(workDaysStr, startStr, endStr) {
    let s = 0, e = 0;
    if (startStr && endStr) { 
      let [h1,m1] = startStr.split(':'); s = (parseInt(h1) + parseInt(m1||0)/60) / 24 * 100; 
      let [h2,m2] = endStr.split(':'); e = (parseInt(h2) + parseInt(m2||0)/60) / 24 * 100; 
    }
    
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const str = (workDaysStr||'').toLowerCase();
    let wDays = [];
    
    const match = str.match(/(mon|tue|wed|thu|fri|sat|sun)\s*-\s*(mon|tue|wed|thu|fri|sat|sun)/);
    if (match) {
       const dayNames = ['mon','tue','wed','thu','fri','sat','sun'];
       let i1 = dayNames.findIndex(d => match[1].includes(d));
       let i2 = dayNames.findIndex(d => match[2].includes(d));
       if(i1 > -1 && i2 > -1) {
          if(i1 <= i2) { for(let i=i1; i<=i2; i++) wDays.push(dayNames[i]); }
          else { for(let i=i1; i<7; i++) wDays.push(dayNames[i]); for(let i=0; i<=i2; i++) wDays.push(dayNames[i]); }
       }
    } else {
       days.forEach(d => { if(str.includes(d.toLowerCase())) wDays.push(d.toLowerCase()); });
       if(wDays.length===0 && str) wDays = days; 
    }
    
    let html = `<div style="display:flex; flex-direction:column; gap:6px; font-size:10px; font-weight:700; background:var(--bg-panel); padding:16px; border-radius:8px; border:1px solid var(--border-color);">`;
    html += `<div style="margin-bottom:4px; color:var(--text-muted); text-transform:uppercase; font-size:11px; display:flex; justify-content:space-between;"><span>Weekly Schedule</span> <span>00:00 - 24:00</span></div>`;
    
    days.forEach(d => {
       let isWorking = wDays.includes(d.toLowerCase()); 
       let barHtml = '';
       if (isWorking && startStr && endStr) {
          if (e >= s) { barHtml = `<div style="position:absolute; left:${s}%; width:${e-s}%; top:0; bottom:0; background:var(--veo-cyan); border-radius:4px; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div>`; } 
          else { barHtml = `<div style="position:absolute; left:${s}%; width:${100-s}%; top:0; bottom:0; background:var(--veo-cyan); border-radius:4px 0 0 4px; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div><div style="position:absolute; left:0; width:${e}%; top:0; bottom:0; background:var(--veo-cyan); border-radius:0 4px 4px 0; box-shadow:0 0 6px rgba(0,229,255,0.3);"></div>`; }
       }
       html += `<div style="display:flex; align-items:center; gap:8px;">
         <div style="width:25px; color:${isWorking ? 'var(--text-main)' : 'var(--text-muted)'}; opacity:${isWorking?1:0.4};">${d}</div>
         <div style="flex:1; height:12px; background:rgba(0,0,0,0.05); border-radius:4px; position:relative; border:1px solid var(--border-color); overflow:hidden;">
           ${barHtml}
           <div style="position:absolute; left:25%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div>
           <div style="position:absolute; left:50%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div>
           <div style="position:absolute; left:75%; top:0; bottom:0; border-left:1px dashed var(--text-muted); opacity:0.2;"></div>
         </div>
       </div>`;
    });
    html += `<div style="display:flex; justify-content:space-between; margin-left:33px; color:var(--text-muted); font-size:9px; margin-top:2px; padding:0 2px;"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>`;
    html += `</div>`;
    return html;
  }

  function handleRosterInput() {
    const inputEl = document.getElementById('roster-input'); const btn = document.getElementById('roster-action-btn'); if(!inputEl || !btn) return;
    const val = inputEl.value.trim().toLowerCase(); const isEx = (globalState.config.techRoster || []).some(r => r.toLowerCase() === val);
    btn.innerText = (val && isEx) ? 'Remove' : 'Add'; btn.className = (val && isEx) ? 'btn btn-danger' : 'btn btn-dark';
  }
  function handleRosterAction() {
    const inputEl = document.getElementById('roster-input'); if(!inputEl) return;
    const val = inputEl.value.trim(); if(!val) return;
    if((globalState.config.techRoster || []).some(r => r.toLowerCase() === val.toLowerCase())) removeRoster(val); else addRoster(val);
  }
  
  function addRoster(name) { document.getElementById('roster-input').value = ''; globalState.config.techRoster.push(name.trim()); populateModals(); refreshActiveViews(); google.script.run.addTechToRoster(name.trim()); }

    if(vIdx > -1) {
      globalState.vehicles[vIdx].cleanName = p.vanName; globalState.vehicles[vIdx].makeModel = p.makeModel; globalState.vehicles[vIdx].agency = p.rentalAgency; globalState.vehicles[vIdx].vin = p.vin;
      globalState.vehicles[vIdx].plate = p.licensePlate; globalState.vehicles[vIdx].plateExpDate = p.plateExpDate; globalState.vehicles[vIdx].samsaraSerial = p.samsaraSerial; globalState.vehicles[vIdx].samsaraLink = p.samsaraLink;
      globalState.vehicles[vIdx].pickupDate = p.pickupDate; globalState.vehicles[vIdx].serviceNumber = p.serviceNumber; globalState.vehicles[vIdx].addons = p.addons;
    }
    refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).updateVehicleDetails(p);
  }

  function submitIncident(e) {
    e.preventDefault();
    const cleanName = document.getElementById('inc_van').value.trim();
    const v = globalState.vehicles.find(x => x.cleanName.trim().toLowerCase() === cleanName.toLowerCase());
    if (!v) { alert("Error: Could not locate vehicle data."); return; }
    const incDriverEl = document.getElementById('inc_driver');
    const triggerOosEl = document.getElementById('inc_oos');
    const p = {
      cleanName: v.cleanName, rentalId: v.rentalId, issueCategory: document.getElementById('inc_cat').value, statusImpact: document.getElementById('inc_impact').value,
      triggerOos: triggerOosEl ? triggerOosEl.checked : true, description: document.getElementById('inc_desc').value, driverInvolved: incDriverEl ? incDriverEl.value : ''
    };
    closeModal('incidentModal');
    if(p.triggerOos) {
      const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      v.status = 'Out of Service'; v.zone = '—'; v.driver = '—'; 
      globalState.deployments.forEach(d => { if ((d.status === 'Dispatched' || d.status === 'Active') && (d.rentalId === p.rentalId || d.vehicle === p.cleanName)) { d.status = 'Completed'; d.returnTime = timeString; } });
      populateModals(); refreshActiveViews();
    }
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler((res) => { if(res && !res.success) alert("Backend Warning: " + res.message); loadPortalData(); }).withFailureHandler(err => { alert("Critical Backend Error: " + err.message); loadPortalData(); }).processReportIncident(p);
  }

  function submitCheckIn(e) {
    e.preventDefault();
    const cleanName = document.getElementById('ci_van').value.trim();
    const v = globalState.vehicles.find(x => x.cleanName.trim().toLowerCase() === cleanName.toLowerCase());
    if (!v) { alert("Error: Could not locate vehicle data. Please select the van from the dropdown manually."); return; }
    const p = { cleanName: v.cleanName, rentalId: v.rentalId, resolutionNotes: document.getElementById('ci_notes').value };
    const inc = (globalState.incidents || []).find(i => i.rentalId === p.rentalId && !i.dateResolved);
    if (inc) p.incidentId = inc.id;

    closeModal('checkInModal');
    v.status = 'Warehouse (Ready)'; v.notes = ''; v.driver = '—'; v.zone = '—';   
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler((res) => { if(res && !res.success) alert("Backend Warning: " + res.message); loadPortalData(); }).withFailureHandler(err => { alert("Critical Backend Error: " + err.message); loadPortalData(); }).processCheckInVehicle(p);
  }

  function submitDecom(e) {
    e.preventDefault();
    const targetId = document.getElementById('dec_van').value;
    const reason = document.getElementById('dec_reason').value;
    closeModal('decomModal');
    const vIdx = globalState.vehicles.findIndex(v=>v.cleanName===targetId);
    if(vIdx > -1) globalState.vehicles[vIdx].status = 'Decommissioned';
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).decommissionVehicle(targetId, reason);
  }

  function submitDispatch(e) {
    e.preventDefault();
    const sel = document.getElementById('dp_van'); const opt = sel.options[sel.selectedIndex];
    const rentalId = opt.getAttribute('data-rental'); const cleanName = sel.value;
    const assignedTech = document.getElementById('dp_tech').value; const coDriver = document.getElementById('dp_codriver').value;
    if (assignedTech === coDriver && assignedTech !== '') { alert("Lead tech and co-driver cannot be the same person."); return; }
    
    const leadTechProfile = globalState.techs.find(t => t.name === assignedTech);
    if (leadTechProfile && !leadTechProfile.passedTest) {
      if(confirm(`⚠️ WARNING: ${assignedTech} has not passed their driving test!\n\nHave they passed it now? (Click OK to allow this dispatch and update their profile)`)) {
        leadTechProfile.passedTest = true; google.script.run.overrideDrivingTest(assignedTech);
      } else { return; }
    }

    const activeDeps = globalState.deployments.filter(d => d.status === 'Dispatched');
    let conflicts = [], warnings = [];
    activeDeps.forEach(d => {
      let isC = false, rsn = [];
      if (d.rentalId === rentalId) { isC = true; rsn.push(`Van ${cleanName} is assigned to ${d.tech}`); }
      if (d.tech === assignedTech || (d.coDriver && d.coDriver === assignedTech)) { isC = true; rsn.push(`${assignedTech} is driving ${d.vehicle}`); }
      if (coDriver && (d.tech === coDriver || (d.coDriver && d.coDriver === coDriver))) { isC = true; rsn.push(`${coDriver} is driving ${d.vehicle}`); }
      if (isC) { conflicts.push(d); warnings.push("⚠️ " + rsn.join(" AND ")); }
    });
    warnings = [...new Set(warnings)];
    if (warnings.length > 0) { if (!confirm("CONFLICTS DETECTED:\n\n" + warnings.join("\n") + "\n\nEnd active shifts and re-deploy?")) return; }

    const p = {
      cleanName: cleanName, rentalId: rentalId, assignedTech: assignedTech, coDriver: coDriver, isTraining: document.getElementById('dp_training').checked, 
      shift: document.getElementById('dp_shift').value, workZone: document.getElementById('dp_zone').value, batteryTarget: document.getElementById('dp_target').value,
      focusCategory: document.getElementById('dp_focus').value, goals: document.getElementById('dp_goals').value
    };
    closeModal('dispatchModal');

    const now = new Date(); const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    conflicts.forEach(c => {
      c.status = 'Completed'; c.returnTime = timeString;
      if (c.rentalId !== rentalId) { const oldV = globalState.vehicles.find(v => v.rentalId === c.rentalId); if (oldV) { oldV.status = 'Warehouse (Ready)'; oldV.zone = '—'; oldV.driver = '—'; } }
    });

    globalState.deployments.unshift({ id:'...', date: now.toISOString().split('T')[0], shift: p.shift, vehicle: p.cleanName, rentalId: p.rentalId, tech: p.assignedTech, zone: p.workZone, status: 'Dispatched', departureTime: timeString, coDriver: p.coDriver, isTraining: p.isTraining });
    const vIdx = globalState.vehicles.findIndex(v=>v.rentalId===p.rentalId);
    if(vIdx > -1) { globalState.vehicles[vIdx].status = 'Dispatched'; globalState.vehicles[vIdx].zone = p.workZone; globalState.vehicles[vIdx].driver = p.coDriver ? `${p.assignedTech} & ${p.coDriver}` : p.assignedTech; }
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).processDispatchCheckout(p);
  }

  function submitEditDispatch(e) {
    e.preventDefault();
    const p = { id: document.getElementById('ed_id').value, zone: document.getElementById('ed_zone').value, target: document.getElementById('ed_target').value, goals: document.getElementById('ed_goals').value };
    closeModal('editDispatchModal');
    const dIdx = globalState.deployments.findIndex(d=>d.id===p.id);
    if(dIdx > -1) { globalState.deployments[dIdx].zone = p.zone; globalState.deployments[dIdx].target = p.target; globalState.deployments[dIdx].goals = p.goals; }
    refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).updateDeploymentRecord(p);
  }

  function endShift(depId, rentId) {
    if(!confirm("End shift?")) return;
    const dIdx = globalState.deployments.findIndex(d=>d.id===depId);
    if(dIdx > -1) { globalState.deployments[dIdx].status = 'Completed'; globalState.deployments[dIdx].returnTime = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    const vIdx = globalState.vehicles.findIndex(v=>v.rentalId===rentId);
    if(vIdx > -1) { globalState.vehicles[vIdx].status = 'Warehouse (Ready)'; globalState.vehicles[vIdx].driver = '—'; globalState.vehicles[vIdx].zone = '—'; }
    populateModals(); refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).endShift(depId, rentId);
  }

  function triggerCsvExport() {
    const dateVal = document.getElementById('hist-date').value; const shiftSelect = document.getElementById('hist-shift'); const shiftName = shiftSelect && shiftSelect.value ? shiftSelect.value : 'First Shift';
    google.script.run.withSuccessHandler(function(res) {
      if (!res.success) { alert(res.message); return; }
      const blob = new Blob([res.csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.setAttribute('download', res.filename); document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }).withFailureHandler(function(err) { alert('Export failed: ' + err.message); }).exportShiftManifestCsv(dateVal, shiftName);
  }

  function triggerPdfPrint() {
    const dateVal = document.getElementById('hist-date').value; const shiftSelect = document.getElementById('hist-shift'); const shiftName = shiftSelect && shiftSelect.value ? shiftSelect.value : 'First Shift';
    google.script.run.withSuccessHandler(function(htmlString) {
      const printWindow = window.open('', '_blank'); printWindow.document.open(); printWindow.document.write(htmlString); printWindow.document.close();
    }).withFailureHandler(function(err) { alert('Failed to generate PDF: ' + err.message); }).getPrintableShiftManifestHtml(dateVal, shiftName);
  }

  /* --- NEW TECH MANAGEMENT FUNCTIONS --- */
  function submitAttendance(e) {
    e.preventDefault();
    const p = {
      techName: document.getElementById('att_tech').value, date: document.getElementById('att_date').value,
      type: document.getElementById('att_type').value, notes: document.getElementById('att_notes').value
    };
    closeModal('attendanceModal');
    const tIdx = globalState.techs.findIndex(t => t.name === p.techName);
    if(tIdx > -1) globalState.techs[tIdx].status = p.type;
    refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).logTechAttendance(p);
  }

  function clearTechException(techName, isLate) {
    if(!confirm(`Are you sure you want to clear the exception for ${techName} and return them to Available?`)) return;
    const tIdx = globalState.techs.findIndex(t => t.name === techName);
    if(tIdx > -1) globalState.techs[tIdx].status = 'Available';
    refreshActiveViews();
    const loader = document.getElementById('global-loader'); if(loader) loader.style.display='block';
    google.script.run.withSuccessHandler(()=>loadPortalData()).clearTechException({ techName: techName, isLate: isLate });
  }
</script>
